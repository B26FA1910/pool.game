<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0c110f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Билльярд">
<title>Билльярд — 8 бөмбөг</title>
<style>
:root{
  --bg:#0c110f; --panel:#141b18; --panel2:#1b2420; --line:#2a3631; --text:#eef3ee; --muted:#93a39a; --accent:#e8b84f;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:radial-gradient(1200px 700px at 50% -10%,#1b2a23 0%,var(--bg) 62%);
  color:var(--text);font:14px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif;
  overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;overscroll-behavior:none;
}
#app{
  height:100vh;height:100dvh;display:flex;flex-direction:column;gap:8px;
  padding:calc(10px + env(safe-area-inset-top)) calc(12px + env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) calc(12px + env(safe-area-inset-left));
}
header{display:flex;align-items:center;gap:6px}
h1{font-size:17px;font-weight:750;letter-spacing:.2px;margin-right:auto;white-space:nowrap}
h1 span{color:var(--accent);font-weight:650}
.btn,select{
  height:34px;border-radius:9px;border:1px solid var(--line);background:var(--panel2);color:var(--text);
  font:inherit;padding:0 11px;cursor:pointer;touch-action:manipulation
}
select{padding:0 8px;max-width:178px}
.btn:hover,select:hover{border-color:#41524a}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#1d1606;font-weight:700}
.btn.icon{width:34px;padding:0;display:grid;place-items:center;font-size:16px}
.players{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pcard{
  background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:7px 10px;
  display:flex;align-items:center;gap:10px;min-width:0;opacity:.7;
  transition:border-color .2s,box-shadow .2s,opacity .2s
}
.pcard.active{opacity:1;border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent),0 0 22px -8px var(--accent)}
.pinfo{min-width:0}
.pname{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pgroup{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pballs{display:flex;gap:3px;margin-top:4px;flex-wrap:nowrap}
.ava{position:relative;width:38px;height:38px;flex:none;border-radius:50%;display:grid;place-items:center;
  background:var(--avc,#2f6fd8);color:#fff;font-weight:800;font-size:16px;box-shadow:inset 0 -3px 7px rgba(0,0,0,.35)}
#p1 .ava{--avc:#d8682d}
.ava svg{position:absolute;left:-5px;top:-5px;width:48px;height:48px;transform:rotate(-90deg);pointer-events:none}
.ava .trk{fill:none;stroke:rgba(255,255,255,.07);stroke-width:3}
.ava .prg{fill:none;stroke:var(--accent);stroke-width:3.2;stroke-linecap:round;stroke-dasharray:125.66;stroke-dashoffset:125.66}
.ava.warn .prg{stroke:#ff5a43}
.pcard:not(.active) .prg{opacity:0}
.pcard.right{flex-direction:row-reverse;text-align:right}
.pcard.right .pballs{justify-content:flex-end}
.pwin{font-size:12px;color:var(--accent);white-space:nowrap;margin-left:auto}
.pcard.right .pwin{margin-left:0;margin-right:auto}
.mini.slot{background:#090c0b;box-shadow:inset 0 1px 3px rgba(0,0,0,.9),0 0 0 1px rgba(255,255,255,.07)}
.mini.eight{box-shadow:0 0 0 2px var(--accent),inset -2px -2px 3px rgba(0,0,0,.35)}
#bigSpin{width:min(220px,62vw,44vh);aspect-ratio:1;margin:6px auto 4px;border-radius:50%;position:relative;touch-action:none;
  background:radial-gradient(circle at 35% 30%,#fff,#ebe7dc 55%,#b6b1a3);box-shadow:0 6px 22px rgba(0,0,0,.5)}
#bigSpin::before,#bigSpin::after{content:"";position:absolute;background:rgba(0,0,0,.14)}
#bigSpin::before{left:50%;top:10%;bottom:10%;width:1px}
#bigSpin::after{top:50%;left:10%;right:10%;height:1px}
#bigDot{position:absolute;width:24px;height:24px;border-radius:50%;background:#d63b2f;transform:translate(-50%,-50%);
  box-shadow:0 0 0 3px rgba(255,255,255,.85);pointer-events:none}
.card.spincard h2{text-align:center}
.card.spincard{max-width:340px}
body.compact .card.spincard{padding:12px 16px}
body.compact .card.spincard h2{font-size:16px;margin-bottom:4px}
body.compact .card.spincard .note{display:none}
body.compact .card.spincard .row{margin-top:10px}
.card.spincard .note{text-align:center;margin-top:8px}
.mini{width:15px;height:15px;border-radius:50%;box-shadow:inset -2px -2px 3px rgba(0,0,0,.35),0 0 0 1px rgba(0,0,0,.25)}
#msg{min-height:20px;text-align:center;font-size:14px;transition:color .2s}
#msg.foul{color:#ff9580}
#msg.good{color:#a6e9a6}
main{flex:1;min-height:0;display:flex;gap:10px}
#stage{flex:1;min-width:0;min-height:0;position:relative}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block;cursor:crosshair}
#side{width:84px;display:flex;flex-direction:column;align-items:center;gap:12px;padding:2px 0;transition:opacity .2s}
#side.disabled{opacity:.38;pointer-events:none}
.grp{display:flex;flex-direction:column;align-items:center;gap:5px}
.grp-power{flex:1;min-height:0;width:100%}
.lbl{font-size:11px;color:var(--muted);white-space:nowrap}
#power{
  position:relative;flex:1;width:46px;min-height:110px;border-radius:12px;overflow:hidden;
  background:#0b100e;border:1px solid var(--line);touch-action:none;cursor:ns-resize
}
#power::before{
  content:"";position:absolute;inset:0;
  background:repeating-linear-gradient(180deg,transparent 0 9.5%,rgba(255,255,255,.07) 9.5% 10%);
}
#powerFill{
  position:absolute;inset:0;background:linear-gradient(180deg,#3fbf6e,#e8b84f 55%,#e5533d);
  clip-path:inset(0 0 100% 0)
}
#powerHint{position:absolute;inset:0;display:grid;place-items:center;font-size:20px;color:rgba(255,255,255,.35);pointer-events:none}
#powerHint::after{content:"⇣"}
#powerCue{
  position:absolute;left:50%;top:5px;width:9px;height:calc(100% + 60px);border-radius:5px 5px 2px 2px;pointer-events:none;
  transform:translate(-50%,calc(var(--p,0) * 78%));box-shadow:0 2px 6px rgba(0,0,0,.6);
  background:linear-gradient(180deg,#3d6aa0 0 5px,#f3eee2 5px 14px,#ead3a6 14px,#d9b277 55%,#1d1d1d 55% 57%,#6b3416 57%,#2a1208)
}
.grp-spin,.grp-aim{flex:none}
#wheel{
  position:relative;width:46px;height:132px;border-radius:11px;overflow:hidden;touch-action:none;cursor:ns-resize;flex:none;
  background:#141414;border:1px solid #333;box-shadow:0 3px 10px rgba(0,0,0,.55)
}
#wheelTex{
  position:absolute;inset:0;
  background-image:repeating-linear-gradient(180deg,#2e2e2e 0 3px,#0b0b0b 3px 4px,#454545 4px 5px,#1d1d1d 5px 10px)
}
#wheel::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(0,0,0,.92),rgba(0,0,0,.25) 28%,rgba(255,255,255,.08) 50%,rgba(0,0,0,.25) 72%,rgba(0,0,0,.92))
}
#wheel::before{
  content:"";position:absolute;z-index:1;pointer-events:none;left:-1px;right:-1px;top:50%;height:2px;margin-top:-1px;
  background:linear-gradient(90deg,var(--accent) 0 7px,transparent 7px calc(100% - 7px),var(--accent) calc(100% - 7px))
}
#wheel.active{border-color:var(--accent)}
#spin{
  width:60px;height:60px;border-radius:50%;position:relative;touch-action:none;cursor:crosshair;flex:none;
  background:radial-gradient(circle at 35% 30%,#fff,#ebe7dc 55%,#b6b1a3);box-shadow:0 2px 10px rgba(0,0,0,.45)
}
#spin::before,#spin::after{content:"";position:absolute;background:rgba(0,0,0,.13)}
#spin::before{left:50%;top:12%;bottom:12%;width:1px}
#spin::after{top:50%;left:12%;right:12%;height:1px}
#spinDot{
  position:absolute;width:12px;height:12px;border-radius:50%;background:#d63b2f;left:50%;top:50%;
  transform:translate(-50%,-50%);box-shadow:0 0 0 2px rgba(255,255,255,.8);pointer-events:none
}
.aimbtns{display:flex;gap:6px}
body.portrait main{flex-direction:column}
body.portrait #side{width:auto;flex-direction:row;align-items:flex-end;padding:0;gap:12px}
body.portrait .grp-power{flex:1;min-width:0;width:auto}
body.portrait #power{flex:none;width:100%;height:46px;min-height:0;cursor:ew-resize}
body.portrait #power::before{background:repeating-linear-gradient(90deg,transparent 0 9.5%,rgba(255,255,255,.07) 9.5% 10%)}
body.portrait #powerFill{background:linear-gradient(90deg,#3fbf6e,#e8b84f 55%,#e5533d);clip-path:inset(0 100% 0 0)}
body.portrait #powerHint::after{content:"⇢"}
body.portrait #powerCue{left:5px;top:50%;width:calc(100% + 60px);height:9px;border-radius:5px 2px 2px 5px;
  transform:translate(calc(var(--p,0) * 78%),-50%);
  background:linear-gradient(90deg,#3d6aa0 0 5px,#f3eee2 5px 14px,#ead3a6 14px,#d9b277 55%,#1d1d1d 55% 57%,#6b3416 57%,#2a1208)}
body.portrait .grp-aim .aimbtns{display:none}
body.portrait #wheel{width:132px;height:46px;cursor:ew-resize}
body.portrait #wheelTex{background-image:repeating-linear-gradient(90deg,#2e2e2e 0 3px,#0b0b0b 3px 4px,#454545 4px 5px,#1d1d1d 5px 10px)}
body.portrait #wheel::after{background:linear-gradient(90deg,rgba(0,0,0,.92),rgba(0,0,0,.25) 28%,rgba(255,255,255,.08) 50%,rgba(0,0,0,.25) 72%,rgba(0,0,0,.92))}
body.portrait #wheel::before{left:50%;right:auto;top:-1px;bottom:-1px;width:2px;height:auto;margin:0 0 0 -1px;
  background:linear-gradient(180deg,var(--accent) 0 7px,transparent 7px calc(100% - 7px),var(--accent) calc(100% - 7px))}
body.portrait #spin{width:52px;height:52px}
/* phone held sideways: power on the left, spin + aim wheel on the right (like mobile pool games) */
body.compact #app{display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-rows:auto auto minmax(0,1fr);
  grid-template-areas:"head players" "net net" "main main";gap:5px;
  padding:calc(5px + env(safe-area-inset-top)) calc(8px + env(safe-area-inset-right)) calc(5px + env(safe-area-inset-bottom)) calc(8px + env(safe-area-inset-left))}
body.compact header{grid-area:head}
body.compact h1{display:none}
body.compact .players{grid-area:players}
body.compact .pcard{padding:3px 9px;gap:8px}
body.compact .pname{font-size:13px}
body.compact .ava{width:30px;height:30px;font-size:13px}
body.compact .ava svg{left:-5px;top:-5px;width:40px;height:40px}
body.compact .pballs{margin-top:2px}
body.compact .mini{width:12px;height:12px}
body.compact #netbar{grid-area:net;min-height:18px;font-size:12px}
body.compact #netbar .btn{height:22px}
body.compact #msg{position:fixed;z-index:5;left:50%;bottom:calc(7px + env(safe-area-inset-bottom));transform:translateX(-50%);
  max-width:min(70vw,560px);min-height:0;padding:3px 12px;border-radius:999px;font-size:12px;line-height:1.3;
  background:rgba(8,12,10,.72);pointer-events:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
body.compact #msg:empty{display:none}
body.compact main{grid-area:main;display:grid;gap:8px;grid-template-columns:54px minmax(0,1fr) 62px;
  grid-template-rows:auto minmax(0,1fr);grid-template-areas:"power stage spin" "power stage aim"}
body.compact #stage{grid-area:stage}
body.compact #side{display:contents}
body.compact .grp-power{grid-area:power;height:100%;min-height:0}
body.compact #power{width:50px;min-height:0}
body.compact .grp-spin{grid-area:spin}
body.compact .grp-aim{grid-area:aim;min-height:0}
body.compact #spin{width:50px;height:50px}
body.compact #wheel{flex:1;height:auto;min-height:70px;width:48px}
body.compact .grp-aim .aimbtns{display:none}
body.compact .lbl{font-size:10px}
body.compact .grp-spin .lbl{display:none}
body.compact #side.disabled .grp{opacity:.38}
#overlay{position:fixed;inset:0;display:none;place-items:center;background:rgba(5,8,7,.64);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);z-index:10;padding:16px}
#overlay.show{display:grid}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px 22px;max-width:470px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.5);max-height:calc(100dvh - 32px);overflow:auto}
.card h2{font-size:19px;margin-bottom:12px}
.card ul{padding-left:18px;color:#cfd9d2;display:grid;gap:7px;font-size:13.5px}
.card b{color:var(--text)}
.card .row{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
.trophy{font-size:44px;text-align:center;margin-bottom:4px}
.card.win h2{text-align:center;font-size:22px;margin-bottom:6px}
.card .why{text-align:center;color:#cfd9d2}
.card.win .row{justify-content:center}
#netbar{display:none;align-items:center;justify-content:center;gap:10px;font-size:13px;color:var(--muted);min-height:22px}
#netbar.show{display:flex}
#netbar .dot{width:8px;height:8px;border-radius:50%;background:#e5533d;display:inline-block;margin-right:5px}
#netbar .dot.on{background:#3fbf6e}
#netbar b{color:var(--text);letter-spacing:1px}
#netbar .btn{height:26px;padding:0 10px;font-size:12px}
.fld{display:grid;gap:5px;font-size:12.5px;color:var(--muted);margin-bottom:12px}
.fld input,.joinrow input{height:38px;border-radius:9px;border:1px solid var(--line);background:#0e1412;color:var(--text);font:inherit;font-size:15px;padding:0 12px;outline:none;-webkit-user-select:text;user-select:text}
.fld input:focus,.joinrow input:focus{border-color:var(--accent)}
.sec{font-size:12px;color:var(--muted);margin:16px 0 7px;text-transform:uppercase;letter-spacing:.6px}
.ol-list{display:grid;gap:6px}
.ol-item{display:flex;align-items:center;gap:10px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:7px 8px 7px 12px}
.ol-item .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.ol-item .cd{color:var(--muted);font-size:12px}
.ol-empty{color:var(--muted);font-size:13px;padding:4px 2px}
.joinrow{display:flex;gap:8px}
.joinrow input{flex:1;min-width:0;letter-spacing:2px}
.btn.block{width:100%;height:40px}
.note{font-size:12.5px;color:var(--muted);margin-top:14px;line-height:1.45}
.note b{color:var(--text)}
.err{color:#ff9580;font-size:13px;margin-top:8px;min-height:1px}
@media (max-width:420px){ h1{display:none} header select{margin-right:auto} }
@media (max-width:560px){
  h1 span,.wide{display:none}
  .pcard{gap:7px;padding:6px 8px}
  .mini{width:13px;height:13px}
  .pballs{gap:2px}
  .ava{width:32px;height:32px;font-size:14px}
  .ava svg{left:-5px;top:-5px;width:42px;height:42px}
  .pwin{display:none}
  select{max-width:150px}
}
@media (max-height:520px){
  #app{gap:5px;padding-top:calc(6px + env(safe-area-inset-top));padding-bottom:calc(6px + env(safe-area-inset-bottom))}
  .pcard{padding:4px 9px}
  .btn,select{height:30px}
  .btn.icon{width:30px}
  #spin{width:50px;height:50px}
  #side{gap:8px}
}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>Билльярд <span>· 8 бөмбөг</span></h1>
    <select id="mode" aria-label="Тоглох горим">
      <option value="ai1">Компьютер · хялбар</option>
      <option value="ai2" selected>Компьютер · дунд</option>
      <option value="ai3">Компьютер · хэцүү</option>
      <option value="pvp">2 тоглогч</option>
      <option value="online">🌐 Онлайн</option>
    </select>
    <button class="btn" id="newBtn" title="Шинэ тоглоом">⟲<span class="wide">&nbsp;Шинэ</span></button>
    <button class="btn icon" id="helpBtn" title="Тусламж">?</button>
    <button class="btn icon" id="muteBtn" title="Дуу">🔊</button>
    <button class="btn icon" id="fsBtn" title="Бүтэн дэлгэц" hidden>⛶</button>
  </header>
  <div class="players">
    <div class="pcard" id="p0"><div class="ava"><svg viewBox="0 0 44 44"><circle class="trk" cx="22" cy="22" r="20"/><circle class="prg" cx="22" cy="22" r="20"/></svg><span class="ini"></span></div><div class="pinfo"><div class="pname"></div><div class="pballs"></div></div><div class="pwin"></div></div>
    <div class="pcard right" id="p1"><div class="ava"><svg viewBox="0 0 44 44"><circle class="trk" cx="22" cy="22" r="20"/><circle class="prg" cx="22" cy="22" r="20"/></svg><span class="ini"></span></div><div class="pinfo"><div class="pname"></div><div class="pballs"></div></div><div class="pwin"></div></div>
  </div>
  <div id="netbar"><span id="netTxt"></span><button class="btn" id="netLeave">Гарах</button></div>
  <div id="msg"></div>
  <main>
    <div id="stage"><canvas id="cv"></canvas></div>
    <div id="side">
      <div class="grp grp-power"><div class="lbl">Хүч</div><div id="power"><div id="powerFill"></div><div id="powerHint"></div><div id="powerCue"></div></div></div>
      <div class="grp grp-spin"><div class="lbl">Эргэлт</div><div id="spin" title="Давхар дарвал цэвэрлэнэ"><div id="spinDot"></div></div></div>
      <div class="grp grp-aim"><div class="lbl">Онилох</div><div id="wheel" title="Гүйлгэж нарийн онилно"><div id="wheelTex"></div></div><div class="aimbtns"><button class="btn icon" id="rotL" title="Зүүн тийш эргүүлэх">↺</button><button class="btn icon" id="rotR" title="Баруун тийш эргүүлэх">↻</button></div></div>
    </div>
  </main>
</div>
<div id="overlay"><div class="card" id="ovCard"></div></div>

<script>
(()=>{
'use strict';
/* ================= constants ================= */
const W=1000,H=500,R=11,RAIL=50,CW=16;
const CG=41,CRC=16,CWALL=26;   // corner pocket: rail end, rounded jaw radius, throat wall
const SG=39,SRC=14,SWALL=12;   // middle pocket: rail end (from centre), jaw radius, wall
const FIX=1/120,MAXV=2300,FR_C=100,FR_L=0.3,STOP_V=4,E_BALL=0.97,E_RAIL=0.8,SLIP_K=1000,ROLL=0.28;
const STRIKE_MS=90, TRAY=40, TUBE_X=-RAIL-TRAY/2-2, TUBE_Y0=-RAIL+6, TUBE_Y1=H+RAIL-6;
const DROP_MS=210, ROLL_MS=620, SHOT_SEC=30;
const HEAD_X=W/4, FOOT={x:W*0.75,y:H/2}, HEAD={x:W/4-30,y:H/2};
const TAU=Math.PI*2;
const COLORS=['#f7f4ec','#f2c21b','#1f4fd1','#d6262b','#5a2d8c','#f07a14','#11804a','#7c1d22','#151515','#f2c21b','#1f4fd1','#d6262b','#5a2d8c','#f07a14','#11804a','#7c1d22'];
const groupOf=id=>id===0?'cue':id===8?'eight':(id<8?'solid':'stripe');
const GNAME={solid:'Бүтэн (1–7)',stripe:'Судалтай (9–15)'};
const clamp=(v,a,b)=>v<a?a:v>b?b:v;

/* cushions: straight rail + rounded (snooker-style) jaw at each end */
function jawPts(S,u,o,corner){
  const rc=corner?CRC:SRC, th=corner?Math.PI/4:Math.PI/2, L=corner?CWALL:SWALL, n=corner?6:9, pts=[];
  for(let i=0;i<=n;i++){
    const f=th*i/n, su=rc*Math.sin(f), so=rc*(1-Math.cos(f));
    pts.push([S[0]+u[0]*su+o[0]*so, S[1]+u[1]*su+o[1]*so]);
  }
  const e=pts[n], d=[u[0]*Math.cos(th)+o[0]*Math.sin(th), u[1]*Math.cos(th)+o[1]*Math.sin(th)];
  pts.push([e[0]+d[0]*L, e[1]+d[1]*L]);
  return pts;
}
const RAILS=[
  {a:[CG,0],ua:[-1,0],ca:true,  b:[W/2-SG,0],ub:[1,0],cb:false, o:[0,-1]},
  {a:[W/2+SG,0],ua:[-1,0],ca:false, b:[W-CG,0],ub:[1,0],cb:true, o:[0,-1]},
  {a:[CG,H],ua:[-1,0],ca:true,  b:[W/2-SG,H],ub:[1,0],cb:false, o:[0,1]},

/* ================= physics ================= */
const newShot=()=>({firstHit:null,pocketed:[],t:0,where:{}});
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;}
function rack(){
  const balls=[];
  for(let id=0;id<16;id++) balls.push({id,x:0,y:0,vx:0,vy:0,on:true,sx:0,slip:0});
  balls[0].x=HEAD.x; balls[0].y=HEAD.y;
  const d=2*R+0.12, dx=d*Math.sqrt(3)/2, pos=[];
  for(let r=0;r<5;r++) for(let j=0;j<=r;j++) pos.push({x:FOOT.x+r*dx,y:FOOT.y+(j-r/2)*d});
  const idx=(r,j)=>r*(r+1)/2+j;
  const solids=shuffle([1,2,3,4,5,6,7]), stripes=shuffle([9,10,11,12,13,14,15]);
  const slots=new Array(15).fill(0);
  slots[idx(2,1)]=8;
  const flip=Math.random()<0.5;
  slots[idx(4,0)]=flip?solids.pop():stripes.pop();
  slots[idx(4,4)]=flip?stripes.pop():solids.pop();
  const rest=shuffle(solids.concat(stripes));
  for(let k=0;k<15;k++) if(!slots[k]) slots[k]=rest.pop();
  for(let k=0;k<15;k++){const b=balls[slots[k]]; b.x=pos[k].x; b.y=pos[k].y;}

}

}
function substep(S,h,ev){
  const B=S.balls, sh=S.shot;

    const b=B[i]; if(!b.on) continue;
    const vx=b.vx,vy=b.vy; if(vx===0&&vy===0) continue;
    const sp=Math.sqrt(vx*vx+vy*vy), ns=sp-(FR_C+FR_L*sp)*h;
    if(ns<=STOP_V){b.vx=0;b.vy=0;if(i===0)b.slip=0;continue;}
    const k=ns/sp; b.vx=vx*k; b.vy=vy*k; b.x+=b.vx*h; b.y+=b.vy*h;
    if(i===0){

  for(let i=0;i<15;i++){
    const a=B[i]; if(!a.on) continue;

      const b=B[j]; if(!b.on) continue;

      const rv=(a.vx-b.vx)*nx+(a.vy-b.vy)*ny; if(rv<=0) continue;

      if(i===0&&sh.firstHit===null){
        sh.firstHit=b.id;

    for(let k=0;k<SEGS.length;k++){

      if(dx*dx+dy*dy<p.r*p.r){sink(S,b,p,ev);break;}
    }
    if(b.on&&(b.x<-3*R||b.x>W+3*R||b.y<-3*R||b.y>H+3*R)){

  }
}
function advance(S,dt,ev){

function legalIds(S,grp){
  const B=S.balls, r=[];

    else if(own){ if(groupOf(rec.firstHit)!==own) foul='эхлээд өөрийн бөмбөгийг мөргөх ёстой'; }
    else if(rec.firstHit===8) foul='8-р бөмбөгийг эхэлж мөргөж болохгүй';

  if(eightIn){
    if(ctx.isBreak) out.respot8=true;

      const called=ctx.cp==null||ctx.cp<0||(rec.where&&rec.where[8]===ctx.cp);
      if(ctx.wasOnEight&&!foul&&called){out.win=p; out.why='8-р бөмбөгийг оруулж тоглолтыг дуусгалаа.';}
      else{out.win=1-p; out.why=foul?`8-р бөмбөг орох үед алдаа гарсан (${foul}).`

  }
  return out;
}

const AI_LEVEL={ai1:{noise:2.0,pnoise:.12,sloppy:.4},ai2:{noise:0.75,pnoise:.06,sloppy:.12},ai3:{noise:0.28,pnoise:.03,sloppy:0}};
function pathClear(St,x1,y1,x2,y2,ia,ib,rad){
  const dx=x2-x1,dy=y2-y1,l2=dx*dx+dy*dy||1,r2=rad*rad;
  for(const b of St.balls){
    if(!b.on||b.id===ia||b.id===ib) continue;
    let t=((b.x-x1)*dx+(b.y-y1)*dy)/l2; t=t<0?0:t>1?1:t;
    const ex=b.x-(x1+t*dx),ey=b.y-(y1+t*dy);
    if(ex*ex+ey*ey<r2) return false;
  }
  return true;
}
function shotEase(St,cx,cy,b,p){
  const ux=p.ax-b.x,uy=p.ay-b.y,dp=Math.hypot(ux,uy); if(dp<1) return null;
  const nx=ux/dp,ny=uy/dp;
  if(p.side&&Math.abs(ny)<0.42) return null;
  const gx=b.x-nx*2*R,gy=b.y-ny*2*R;
  if(gx<R-1||gx>W-R+1||gy<R-1||gy>H-R+1) return null;
  const ax=gx-cx,ay=gy-cy,da=Math.hypot(ax,ay); if(da<1) return null;
  const cs=(ax*nx+ay*ny)/da; if(cs<0.25) return null;
  if(!pathClear(St,cx,cy,gx,gy,0,b.id,2*R-0.5)) return null;
  if(!pathClear(St,b.x,b.y,p.ax,p.ay,0,b.id,2*R-0.5)) return null;
  return {ease:cs*cs/(1+(da+dp)/900),angle:Math.atan2(ay,ax),dist:da+dp};

    for(const p of POCKETS){const e=shotEase(St,cx,cy,b,p); if(e&&e.ease>best) best=e.ease;}

function aiScore(S2,ctx){

    const n=rec.pocketed.filter(id=>id!==0&&id!==8&&(!g||groupOf(id)===g)).length;
    s+=300+40*n+260*bestEaseFor(S2,g,cue.x,cue.y);

}

function netRid(){

function wsRoom(name,me){
  const base=(location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws';
  let ws=null,alive=true,connected=false,tries=0,pingT=null,my={},frozen=Object.freeze([]),queued=false;
  const others=new Map(), ph=new Set(), chs=new Set();
  const peerObj=(peer,presence,t,mine)=>Object.freeze({peer,by:null,isMe:mine,sameTab:mine,kind:'viewer',guest:false,presence,updatedAt:t});
  const snap=()=>{
    const arr=[peerObj(me,Object.freeze({...my}),Date.now(),true)];
    for(const [peer,v] of others) arr.push(peerObj(peer,v.p,v.t,false));
    return Object.freeze(arr);
  };
  const notify=()=>{
    if(queued) return; queued=true;
    setTimeout(()=>{queued=false; frozen=snap(); const c={peers:frozen,joined:[],left:[],updated:[]}; for(const h of ph){try{h(c);}catch(e){console.error(e);}}},0);
  };
  const setConn=v=>{if(v===connected) return; connected=v; for(const h of chs){try{h(v);}catch(_){}}};
  const send=o=>{if(ws&&ws.readyState===1){try{ws.send(JSON.stringify(o));}catch(_){}}};
  const merge=(base,d)=>{const n={...base}; for(const k of Object.keys(d)){ if(d[k]===null) delete n[k]; else n[k]=d[k]; } return n;};
  function open(){
    if(!alive) return;
    try{ ws=new WebSocket(base+'?room='+encodeURIComponent(name)+'&peer='+me); }catch(_){ setTimeout(open,2000); return; }
    ws.onopen=()=>{
      tries=0; send({t:'u',d:my});
      clearInterval(pingT); pingT=setInterval(()=>{if(ws&&ws.readyState===1) ws.send('ping');},25000);
    };
    ws.onmessage=e=>{
      if(e.data==='pong') return;
      let m; try{m=JSON.parse(e.data);}catch(_){return;}
      if(!m||typeof m!=='object') return;
      if(m.t==='welcome'&&Array.isArray(m.peers)){
        others.clear();
        for(const p of m.peers) if(p&&typeof p.peer==='string'&&p.peer!==me) others.set(p.peer,{p:Object.freeze(p.p&&typeof p.p==='object'?p.p:{}),t:Date.now()});
        setConn(true); notify();
      }else if(m.t==='u'&&typeof m.peer==='string'&&m.peer!==me&&m.d&&typeof m.d==='object'){
        const cur=others.get(m.peer);
        others.set(m.peer,{p:Object.freeze(merge(cur?cur.p:{},m.d)),t:Date.now()}); notify();
      }else if(m.t==='leave'&&typeof m.peer==='string'){
        if(others.delete(m.peer)) notify();
      }
    };
    ws.onclose=()=>{
      clearInterval(pingT); setConn(false);
      if(alive) setTimeout(open,Math.min(8000,500*2**tries++));
    };
    ws.onerror=()=>{};
  }
  open();
  return {
    name,
    presence:async patch=>{my=merge(my,patch); send({t:'u',d:patch}); notify();},
    peers:()=>frozen,
    onPeers:h=>{ph.add(h); setTimeout(()=>{frozen=snap(); h({peers:frozen,joined:frozen,left:[],updated:[]});},0); return ()=>ph.delete(h);},
    connected:()=>connected,
    onConnection:h=>{chs.add(h); setTimeout(()=>h(connected),0); return ()=>chs.delete(h);},
    emit:async()=>{}, on:()=>()=>{},
    leave:async()=>{alive=false; clearInterval(pingT); try{ws&&ws.close(1000);}catch(_){} setConn(false);},
    join:async n=>{ if(!/^[a-z0-9][a-z0-9_.-]{0,47}$/.test(n)) throw {code:'invalid_argument',message:'room name'}; return wsRoom(n,me); },
  };
}
function wsLobby(){
  return new Promise(res=>{
    const r=wsRoom('lobby',netRid()); let done=false;
    const un=r.onConnection(c=>{if(c&&!done){done=true; res(r);}});
    setTimeout(()=>{if(!done){done=true; un(); r.leave(); res(null);}},6000);
  });
}

function blip(f,d,v,type){

    g.gain.setValueAtTime(Math.min(0.9,v),t); g.gain.exponentialRampToValueAtTime(0.0001,t+d);

  }catch(e){}
}

function noise(dur,vol,freq,q,delay){
  if(!AC||muted) return;

    if(!NOISE){const n=Math.floor(AC.sampleRate*0.6); NOISE=AC.createBuffer(1,n,AC.sampleRate); const d=NOISE.getChannelData(0); for(let i=0;i<n;i++) d[i]=Math.random()*2-1;}
    const t=AC.currentTime+(delay||0), src=AC.createBufferSource(), f=AC.createBiquadFilter(), g=AC.createGain();

  }catch(e){}
}
function sfx(kind,v){
  const now=performance.now(); if(now-(lastSnd[kind]||0)<28) return; lastSnd[kind]=now;
  if(kind==='ball'){const a=Math.min(1,v/1400); blip(2600+Math.random()*500,0.045,0.5*a,'sine'); blip(1300,0.03,0.22*a,'triangle');}
  else if(kind==='rail'){blip(170,0.11,0.45*Math.min(1,v/1600),'sine');}
  else if(kind==='pocket'){ // drop onto the leather, then a short rattle in the net
    blip(125,0.2,0.55,'sine'); blip(70,0.32,0.4,'sine'); noise(0.07,0.32,700,1.2);
    noise(0.035,0.12,2300,5,0.075); noise(0.03,0.08,1900,5,0.13); noise(0.025,0.05,2600,6,0.18);
  }
  else if(kind==='roll'){noise(0.5,0.05,380,0.9);}
  else if(kind==='tray'){blip(1700,0.035,0.18,'triangle'); noise(0.04,0.08,3000,4);}
  else if(kind==='clock'){blip(1250,0.06,0.16,'square');}
  else if(kind==='cue'){blip(950,0.05,0.2+0.4*v,'triangle');}

}

  }

function buildSprites(){
  sprites=[];
  const r=Math.max(2,R*scale*dpr), sz=Math.ceil(r*2+4);
  for(let id=0;id<16;id++){
    const c=document.createElement('canvas'); c.width=c.height=sz;
    const g=c.getContext('2d'); g.translate(sz/2,sz/2);
    g.save(); g.beginPath(); g.arc(0,0,r,0,TAU); g.clip();
    if(id===0||id>8){g.fillStyle='#f5f2e8'; g.fillRect(-r,-r,2*r,2*r);}
    if(id>0&&id<=8){g.fillStyle=COLORS[id]; g.fillRect(-r,-r,2*r,2*r);}
    if(id>8){g.fillStyle=COLORS[id]; g.fillRect(-r,-r*0.56,2*r,r*1.12);}
    if(id>0){
      g.beginPath(); g.arc(0,0,r*0.5,0,TAU); g.fillStyle='#fbf9f2'; g.fill();
      if(r>4.5){
        g.fillStyle='#161616'; g.font=`700 ${Math.max(6,r*0.62)}px system-ui,-apple-system,"Segoe UI",sans-serif`;
        g.textAlign='center'; g.textBaseline='middle'; g.fillText(String(id),0,r*0.05);
      }
    }
    const sh=g.createRadialGradient(-r*0.38,-r*0.42,r*0.04,0,0,r*1.05);
    sh.addColorStop(0,'rgba(255,255,255,.8)'); sh.addColorStop(.16,'rgba(255,255,255,.22)'); sh.addColorStop(.5,'rgba(255,255,255,0)');
    sh.addColorStop(.85,'rgba(0,0,0,.18)'); sh.addColorStop(1,'rgba(0,0,0,.48)');
    g.fillStyle=sh; g.fillRect(-r,-r,2*r,2*r);
    g.restore();
    sprites.push(c);
  }
}
function castGuide(x,y,dx,dy){
  let tBest=Infinity,hit=null,wall=null;
  for(const b of S.balls){
    if(!b.on||b.id===0) continue;
    const mx=x-b.x,my=y-b.y,bq=mx*dx+my*dy,cq=mx*mx+my*my-4*R*R,disc=bq*bq-cq;
    if(disc<0) continue;
    const t=-bq-Math.sqrt(disc);
    if(t>-0.5&&t<tBest){tBest=Math.max(0,t);hit=b;}
  }
  let tw=Infinity,wx=null;
  if(dx>1e-9){const t=(W-R-x)/dx; if(t<tw){tw=t;wx='x';}} else if(dx<-1e-9){const t=(R-x)/dx; if(t<tw){tw=t;wx='x';}}
  if(dy>1e-9){const t=(H-R-y)/dy; if(t<tw){tw=t;wx='y';}} else if(dy<-1e-9){const t=(R-y)/dy; if(t<tw){tw=t;wx='y';}}
  if(tw<tBest){tBest=Math.max(0,tw);hit=null;wall=wx;}
  return {t:tBest,hit,wall,gx:x+dx*tBest,gy:y+dy*tBest};
}
function drawGuide(g,px){
  const c=S.balls[0],dx=Math.cos(G.aim),dy=Math.sin(G.aim),r=castGuide(c.x,c.y,dx,dy);
  const bad=r.hit&&!isLegalFirst(r.hit.id);
  g.save(); g.lineCap='round';
  g.strokeStyle='rgba(255,255,255,.55)'; g.lineWidth=1.4*px; g.setLineDash([6*px,6*px]);
  g.beginPath(); g.moveTo(c.x+dx*R,c.y+dy*R); g.lineTo(r.gx,r.gy); g.stroke(); g.setLineDash([]);
  g.strokeStyle=bad?'rgba(255,110,90,.95)':'rgba(255,255,255,.75)'; g.lineWidth=1.5*px;
  g.beginPath(); g.arc(r.gx,r.gy,R,0,TAU); g.stroke();
  if(r.hit){
    const b=r.hit,nx=(b.x-r.gx)/(2*R),ny=(b.y-r.gy)/(2*R),cs=dx*nx+dy*ny;
    g.strokeStyle=bad?'rgba(255,110,90,.85)':'rgba(255,255,255,.85)'; g.lineWidth=2*px;
    g.beginPath(); g.moveTo(b.x+nx*R,b.y+ny*R); g.lineTo(b.x+nx*(R+30+110*cs),b.y+ny*(R+30+110*cs)); g.stroke();
    const tx=dx-cs*nx,ty=dy-cs*ny,tl=Math.hypot(tx,ty);
    if(tl>0.02){
      g.strokeStyle='rgba(255,255,255,.3)'; g.lineWidth=1.4*px;
      g.beginPath(); g.moveTo(r.gx,r.gy); g.lineTo(r.gx+tx*80,r.gy+ty*80); g.stroke();
    }
  }else if(r.wall){
    const rx=r.wall==='x'?-dx:dx, ry=r.wall==='y'?-dy:dy;
    g.strokeStyle='rgba(255,255,255,.3)'; g.lineWidth=1.4*px;
    g.beginPath(); g.moveTo(r.gx,r.gy); g.lineTo(r.gx+rx*70,r.gy+ry*70); g.stroke();
  }
  g.restore();
}
function drawCue(g,back,ang){
  const c=S.balls[0];
  g.save(); g.translate(c.x,c.y); g.rotate(ang);
  const L=620,x0=-back,x1=-back-L,w0=2.7,w1=6.8;
  g.shadowColor='rgba(0,0,0,.45)'; g.shadowBlur=8*scale*dpr; g.shadowOffsetX=4*scale*dpr; g.shadowOffsetY=7*scale*dpr;
  const gr=g.createLinearGradient(x0,0,x1,0);
  [[0,'#3d6aa0'],[.008,'#3d6aa0'],[.009,'#f3eee2'],[.03,'#f3eee2'],[.031,'#ead3a6'],[.5,'#d9b277'],[.56,'#c99a5c'],
   [.561,'#1d1d1d'],[.575,'#1d1d1d'],[.576,'#6b3416'],[.8,'#4a210c'],[.96,'#2a1208'],[.961,'#111'],[1,'#111']].forEach(s=>gr.addColorStop(s[0],s[1]));
  g.fillStyle=gr;
  g.beginPath(); g.moveTo(x0,-w0); g.lineTo(x1,-w1); g.lineTo(x1,w1); g.lineTo(x0,w0); g.closePath(); g.fill();
  g.shadowColor='transparent';
  g.strokeStyle='rgba(255,255,255,.22)'; g.lineWidth=1;
  g.beginPath(); g.moveTo(x0,-w0*0.45); g.lineTo(x1,-w1*0.45); g.stroke();
  g.restore();
}
/* ---- ball-return tray ---- */
const tray=[];
function trayAdd(id,at){ if(!tray.some(t=>t.id===id)) tray.push({id,at,st:0}); }
function syncTray(){
  for(let i=tray.length-1;i>=0;i--) if(S.balls[tray[i].id].on) tray.splice(i,1);
  for(let id=1;id<16;id++) if(!S.balls[id].on&&!tray.some(t=>t.id===id)) tray.push({id,at:0,st:2});
}
function render(now){

  });

  for(const b of S.balls){if(!b.on) continue; const [X,Y]=scr(b.x,b.y); g.beginPath(); g.arc(X+rr*0.16,Y+rr*0.26,rr*0.98,0,TAU); g.fill();}
  for(const b of S.balls){if(!b.on) continue; const [X,Y]=scr(b.x,b.y),sp=sprites[b.id]; g.drawImage(sp,X-sp.width/2,Y-sp.height/2);}
  for(let i=anims.length-1;i>=0;i--){
    const a=anims[i], pk=POCKETS[a.pk];

/* ================= shot clock (30 s, like mobile pool) ================= */
let inTurnPrev=false, lastClockSec=-1;
const localHumanTurn=()=>G.mode==='online'?(NET.seat===G.cur&&!!netOpp()&&NET.connected):!isAI(G.cur);
const clockPaused=()=>(overlay.classList.contains('show')&&!spinOpen)||(G.mode==='online'&&(!NET.game||!netOpp()));
function shotClock(now,dt){
  const inTurn=G.phase==='aim'||G.phase==='ai';
  if(inTurn&&!inTurnPrev){
    G.turnT0=now; G.callPk=-1; lastClockSec=-1;
    if(G.phase==='aim'&&needCall()&&localHumanTurn()) setMsg(msgEl.textContent+' · 8-р бөмбөгийг оруулах нүхээ товшиж зарлана уу.',msgEl.className);
  }
  inTurnPrev=inTurn;
  if(!inTurn){setRings(-1,0); return;}
  if(clockPaused()) G.turnT0+=dt*1000;
  const left=SHOT_SEC-(now-G.turnT0)/1000;
  setRings(G.cur,clamp(left/SHOT_SEC,0,1));
  if(G.phase==='aim'&&localHumanTurn()&&!clockPaused()){
    const sec=Math.ceil(left);
    if(sec<=5&&sec>0&&sec!==lastClockSec){lastClockSec=sec; sfx('clock');}
    if(left<=0){drag=null; G.charging=null; spinDrag=false; shoot(true);}
  }
}

/* ================= main loop ================= */
let last=performance.now(),acc=0;
function frame(now){
  const dt=Math.min(0.05,Math.max(0,(now-last)/1000)); last=now;
  if(G.phase==='strike'&&now-G.strike.t0>=STRIKE_MS) doStrike();
  if(G.phase==='moving'){
    acc+=dt*G.speed;
    while(acc>=FIX){
      acc-=FIX;
      const mv=advance(S,FIX,EV); S.shot.t+=FIX;
      if(!mv||S.shot.t>40){
        for(const b of S.balls){b.vx=0;b.vy=0;}
        acc=0; playEvents(); endShot(); break;
      }
    }
    playEvents();
  }
  if(G.charging==='key') G.power=Math.min(1,(now-G.chargeT0)/1400);
  if(G.mode==='online') netTick(now);
  shotClock(now,dt);
  updatePowerUI();
  render(now);
  requestAnimationFrame(frame);
}

    <li><b>Цохих:</b> «Хүч» самбарыг татаад (доош эсвэл баруун тийш) суллана. Компьютер дээр Space товчийг дарж барьж байгаад суллаж болно.</li>
    <li><b>Эргэлт:</b> жижиг цагаан бөмбөг дээрх улаан цэгийг дээш тавибал урагшилна, доош тавибал буцаж ухарна, хажуу тийш тавибал хажуугийн эргэлт өгнө. Давхар дарвал цэвэрлэнэ.</li>
    <li><b>Алдаа:</b> цагаан бөмбөг нүхэнд орох, юу ч мөргөхгүй байх, эхлээд өрсөлдөгчийн бөмбөгийг мөргөх. Алдаа гарвал өрсөлдөгч цагаан бөмбөгийг хүссэн газраа тавина (тасархай дугуйг чирнэ).</li>
    <li><b>8-р бөмбөг:</b> оруулахын өмнө нүхээ товшиж зарлана (товшихгүй бол онилгын чиглэлийн нүх алтан хүрээгээр тэмдэглэгдэнэ). Цагаасаа өмнө, буруу нүхэнд оруулах эсвэл оруулахдаа алдаа гаргавал хожигдоно.</li>
    <li><b>Цаг:</b> цохилт бүрт 30 секунд — тоглогчийн зургийн эргэн тойрон дахь цагираг багасна. Хугацаа дуусвал алдаа болж, өрсөлдөгч цагаан бөмбөгийг хүссэн газраа тавина.</li>
  </ul><div class="row"><button class="btn primary" id="ovOk">Ойлголоо</button></div>`;
  overlay.classList.add('show');
  $('#ovOk').onclick=()=>{audio(); hideOverlay();};
}
function showWin(w,why){
  const nm=names();
  ovCard.className='card win';
  ovCard.innerHTML=`<div class="trophy">🏆</div><h2>${nm[w]} яллаа!</h2><p class="why">${why}</p>
    <div class="row"><button class="btn" id="ovClose">Хаах</button><button class="btn primary" id="ovAgain">Дахин тоглох</button></div>`;
  overlay.classList.add('show');
  $('#ovClose').onclick=hideOverlay;
  $('#ovAgain').onclick=()=>{audio(); hideOverlay(); newGame();};
}

/* ================= input ================= */
let drag=null;
function placeCue(x,y){
  const c=S.balls[0], kitchen=G.bih==='kitchen', maxX=kitchen?HEAD_X:W-R;
  x=clamp(x,R,maxX); y=clamp(y,R,H-R);
  for(let it=0;it<6;it++){
    let moved=false;
    for(const b of S.balls){
      if(!b.on||b.id===0) continue;
      let dx=x-b.x,dy=y-b.y,d=Math.hypot(dx,dy);
      if(d<2*R+0.6){ if(d<1e-6){dx=1;dy=0;d=1;} const k=(2*R+0.6)/d; x=clamp(b.x+dx*k,R,maxX); y=clamp(b.y+dy*k,R,H-R); moved=true; }
    }
    if(!moved) break;
  }
  if(validPos(x,y,kitchen,0)){c.x=x;c.y=y;}
}
function setAimTo(p){const c=S.balls[0]; if(Math.hypot(p.x-c.x,p.y-c.y)>3) G.aim=Math.atan2(p.y-c.y,p.x-c.x);}
function aimAtTap(p){
  // tapping on (or next to) a ball aims straight at it; elsewhere aims at the tapped point
  let best=null,bd=(R*2.6)**2;
  for(const b of S.balls){ if(!b.on||b.id===0) continue; const d=(b.x-p.x)**2+(b.y-p.y)**2; if(d<bd){bd=d;best=b;} }
  setAimTo(best?{x:best.x,y:best.y}:p);
}
cv.addEventListener('pointerdown',e=>{
  if(!canHumanShoot()) return;
  audio(); const p=toTable(e), c=S.balls[0], touch=e.pointerType!=='mouse';
  if(needCall()){
    const k=POCKETS.findIndex(pk=>Math.hypot(p.x-pk.x,p.y-pk.y)<pk.r+(touch?24:14));
    if(k>=0){G.callPk=k; sfx('tick'); e.preventDefault(); return;}
  }
  if(G.bih&&Math.hypot(p.x-c.x,p.y-c.y)<R*(touch?4.2:2.6)){drag={mode:'ball'}; cv.style.cursor='grabbing';}
  else if(touch){drag={mode:'rot',id:e.pointerId,sx:e.clientX,sy:e.clientY,moved:false,f:Math.atan2(p.y-c.y,p.x-c.x),p};}
  else{drag={mode:'aim'}; setAimTo(p);}
  try{cv.setPointerCapture(e.pointerId);}catch(_){}
  e.preventDefault();
});
cv.addEventListener('pointermove',e=>{
  const p=toTable(e);
  if(drag&&drag.mode==='ball'){placeCue(p.x,p.y); return;}
  if(drag&&drag.mode==='aim'){setAimTo(p); return;}
  if(drag&&drag.mode==='rot'){
    if(!canHumanShoot()) return;
    if(!drag.moved&&Math.hypot(e.clientX-drag.sx,e.clientY-drag.sy)>8) drag.moved=true;
    const c=S.balls[0], f=Math.atan2(p.y-c.y,p.x-c.x);
    // turn the cue by how far the finger turned around the cue ball (skip right next to it)
    if(drag.moved&&Math.hypot(p.x-c.x,p.y-c.y)>R*2) G.aim+=angDiff(f,drag.f);
    drag.f=f; return;
  }
  const c=S.balls[0];
  cv.style.cursor=(G.bih&&canHumanShoot()&&Math.hypot(p.x-c.x,p.y-c.y)<R*2.6)?'grab':'crosshair';
});
const endDrag=e=>{
  if(drag&&drag.mode==='rot'&&!drag.moved&&e.type==='pointerup'&&canHumanShoot()) aimAtTap(drag.p);
  drag=null; cv.style.cursor='crosshair';
};
cv.addEventListener('pointerup',endDrag); cv.addEventListener('pointercancel',endDrag);
for(const el of [cv,side]) el.addEventListener('contextmenu',e=>e.preventDefault());

/* fine-aim wheel: drag along it to turn the cue a little at a time */
const wheel=$('#wheel'), wheelTex=$('#wheelTex');
let wDrag=null, wOff=0, wTick=0;
const WHEEL_RAD_PER_PX=0.0008;
const wheelPos=e=>portrait?e.clientX:e.clientY;
wheel.addEventListener('pointerdown',e=>{
  if(!canHumanShoot()) return;
  audio(); wDrag={id:e.pointerId,p:wheelPos(e)}; wheel.classList.add('active');
  try{wheel.setPointerCapture(e.pointerId);}catch(_){}
  e.preventDefault();
});
wheel.addEventListener('pointermove',e=>{
  if(!wDrag||wDrag.id!==e.pointerId) return;
  const q=wheelPos(e), d=q-wDrag.p; wDrag.p=q;
  if(!d||!canHumanShoot()) return;
  G.aim+=d*WHEEL_RAD_PER_PX*(e.shiftKey?4:1);
  wOff+=d; wheelTex.style.backgroundPosition=portrait?`${wOff}px 0`:`0 ${wOff}px`;
  wTick+=Math.abs(d);
  if(wTick>=10){wTick=0; sfx('tick'); try{navigator.vibrate&&navigator.vibrate(3);}catch(_){}}
});
const wEnd=e=>{if(wDrag&&wDrag.id===e.pointerId){wDrag=null; wheel.classList.remove('active');}};
wheel.addEventListener('pointerup',wEnd); wheel.addEventListener('pointercancel',wEnd);
wheel.addEventListener('wheel',e=>{
  if(!canHumanShoot()) return;
  e.preventDefault(); const d=(e.deltaY||e.deltaX)*0.4;
  G.aim+=d*WHEEL_RAD_PER_PX; wOff+=d; wheelTex.style.backgroundPosition=portrait?`${wOff}px 0`:`0 ${wOff}px`;
},{passive:false});

powerEl.addEventListener('pointerdown',e=>{
  if(!canHumanShoot()) return;
  audio(); try{powerEl.setPointerCapture(e.pointerId);}catch(_){}
  G.charging={id:e.pointerId,x0:e.clientX,y0:e.clientY}; e.preventDefault();
});
powerEl.addEventListener('pointermove',e=>{
  const ch=G.charging; if(!ch||ch.id!==e.pointerId) return;
  const r=powerEl.getBoundingClientRect(), len=portrait?r.width:r.height;
  const d=portrait?e.clientX-ch.x0:e.clientY-ch.y0;
  G.power=clamp(d/(len*0.9),0,1);
});
const powerUp=e=>{
  const ch=G.charging; if(!ch||ch.id!==e.pointerId) return;
  G.charging=null;
  if(e.type==='pointerup'&&G.power>0.015&&canHumanShoot()) shoot(); else G.power=0;
};
powerEl.addEventListener('pointerup',powerUp); powerEl.addEventListener('pointercancel',powerUp);

function setSpinFrom(e){
  const r=spinEl.getBoundingClientRect();
  let x=(e.clientX-(r.left+r.width/2))/(r.width/2), y=(e.clientY-(r.top+r.height/2))/(r.height/2);
  const m=Math.hypot(x,y); if(m>1){x/=m;y/=m;}
  G.spin={x,y:-y}; updateSpinUI();
}
let spinDrag=false;
function openSpinPicker(){
  spinOpen=true; ovCard.className='card spincard';
  ovCard.innerHTML=`<h2>Эргэлт</h2><div id="bigSpin"><div id="bigDot"></div></div>
    <p class="note">Цохих цэгээ чирж сонго: дээр — урагшилна, доор — ухарна, хажуу — хажуугийн эргэлт.</p>
    <div class="row" style="justify-content:center"><button class="btn" id="spReset">Цэвэрлэх</button><button class="btn primary" id="spOk">Болсон</button></div>`;
  overlay.classList.add('show');
  const big=$('#bigSpin'), dot=$('#bigDot');
  const show=()=>{dot.style.left=(50+G.spin.x*42)+'%'; dot.style.top=(50-G.spin.y*42)+'%';};
  const set=e=>{
    const r=big.getBoundingClientRect();
    let x=(e.clientX-(r.left+r.width/2))/(r.width/2), y=(e.clientY-(r.top+r.height/2))/(r.height/2);
    const m=Math.hypot(x,y); if(m>1){x/=m;y/=m;}
    G.spin={x,y:-y}; updateSpinUI(); show();
  };
  let on=false;
  big.addEventListener('pointerdown',e=>{on=true; try{big.setPointerCapture(e.pointerId);}catch(_){} set(e); e.preventDefault();});
  big.addEventListener('pointermove',e=>{if(on) set(e);});
  big.addEventListener('pointerup',()=>{on=false;}); big.addEventListener('pointercancel',()=>{on=false;});
  $('#spReset').onclick=()=>{G.spin={x:0,y:0}; updateSpinUI(); show();};
  $('#spOk').onclick=hideOverlay;
  show();
}
spinEl.addEventListener('pointerdown',e=>{if(!canHumanShoot())return; if(e.pointerType!=='mouse'){e.preventDefault(); openSpinPicker(); return;} spinDrag=true; try{spinEl.setPointerCapture(e.pointerId);}catch(_){} setSpinFrom(e); e.preventDefault();});
spinEl.addEventListener('pointermove',e=>{if(spinDrag) setSpinFrom(e);});
spinEl.addEventListener('pointerup',()=>{spinDrag=false;});
spinEl.addEventListener('pointercancel',()=>{spinDrag=false;});
spinEl.addEventListener('dblclick',()=>{G.spin={x:0,y:0}; updateSpinUI();});

function holdButton(el,fn){
  let t1=null,t2=null;
  const stop=()=>{clearTimeout(t1); clearInterval(t2); t1=t2=null;};
  el.addEventListener('pointerdown',e=>{
    e.preventDefault(); if(!canHumanShoot()) return; fn(1);
    let n=0; t1=setTimeout(()=>{t2=setInterval(()=>{n++; fn(n>25?4:1);},45);},280);
  });
  ['pointerup','pointerleave','pointercancel'].forEach(ev=>el.addEventListener(ev,stop));
}
holdButton($('#rotL'),m=>{G.aim-=0.0035*m;});
holdButton($('#rotR'),m=>{G.aim+=0.0035*m;});

window.addEventListener('keydown',e=>{
  if(overlay.classList.contains('show')) return;
  if(e.key==='ArrowLeft'||e.key==='ArrowRight'){
    if(!canHumanShoot()) return;
    G.aim+=(e.key==='ArrowLeft'?-1:1)*(e.shiftKey?0.02:0.0035); e.preventDefault();
  }else if(e.code==='Space'){
    e.preventDefault(); if(e.repeat||!canHumanShoot()||G.charging) return;
    audio(); G.charging='key'; G.chargeT0=performance.now();
  }
});
window.addEventListener('keyup',e=>{
  if(e.code!=='Space') return; e.preventDefault();
  if(G.charging==='key'){G.charging=null; if(G.power>0.015&&canHumanShoot()) shoot(); else G.power=0;}
});

const modeSel=$('#mode');
let prevMode=modeSel.value;
modeSel.addEventListener('change',()=>{
  modeSel.blur();
  if(modeSel.value==='online'){ showOnline(); return; }
  if(G.mode==='online') netLeave();
  G.mode=prevMode=modeSel.value; G.wins=[0,0]; newGame();
});
$('#newBtn').addEventListener('click',e=>{e.currentTarget.blur(); audio(); newGame();});
$('#helpBtn').addEventListener('click',e=>{e.currentTarget.blur(); showHelp();});
const muteBtn=$('#muteBtn');
muteBtn.addEventListener('click',()=>{muted=!muted; muteBtn.textContent=muted?'🔇':'🔊'; muteBtn.blur(); audio();});
overlay.addEventListener('pointerdown',e=>{if(e.target===overlay&&G.phase!=='over'){ if(olOpen) closeOnline(); else hideOverlay(); }});
$('#netLeave').addEventListener('click',e=>{e.currentTarget.blur(); netLeave(); modeSel.value=prevMode; G.mode=prevMode; G.wins=[0,0]; newGame();});

const LABELS={ai1:['Компьютер · хялбар','Комп. · хялбар'],ai2:['Компьютер · дунд','Комп. · дунд'],ai3:['Компьютер · хэцүү','Комп. · хэцүү'],pvp:['2 тоглогч','2 тоглогч'],online:['🌐 Онлайн','🌐 Онлайн']};
function setLabels(){const n=innerWidth<560?1:0; for(const o of modeSel.options) o.textContent=LABELS[o.value][n];}
setLabels();
window.addEventListener('resize',()=>{setLabels(); layout();});
const fsBtn=$('#fsBtn'), docEl=document.documentElement;
const fsOn=()=>!!(document.fullscreenElement||document.webkitFullscreenElement);
if(document.fullscreenEnabled||document.webkitFullscreenEnabled){
  fsBtn.hidden=false;
  fsBtn.addEventListener('click',async()=>{
    fsBtn.blur();
    try{
      if(fsOn()){ await (document.exitFullscreen||document.webkitExitFullscreen).call(document); }
      else{
        await (docEl.requestFullscreen||docEl.webkitRequestFullscreen).call(docEl,{navigationUI:'hide'});
        try{ if(innerWidth<900&&screen.orientation&&screen.orientation.lock) await screen.orientation.lock('landscape'); }catch(_){}
      }
    }catch(_){}
  });
  const fsSync=()=>{fsBtn.textContent=fsOn()?'🗗':'⛶'; setTimeout(layout,120);};
  document.addEventListener('fullscreenchange',fsSync); document.addEventListener('webkitfullscreenchange',fsSync);
}
if(!window.claude&&/^https?:$/.test(location.protocol)){
  for(const [rel,href] of [['manifest','manifest.webmanifest'],['apple-touch-icon','icon-180.png'],['icon','icon-192.png']]){
    const l=document.createElement('link'); l.rel=rel; l.href=href; document.head.appendChild(l);
  }
}
if(window.ResizeObserver) new ResizeObserver(layout).observe(stage);

/* ================= start ================= */
G.mode=modeSel.value;
newGame();
layout();
showHelp();
requestAnimationFrame(t=>{last=t; frame(t);});

/* testing hooks */
window.__anims=()=>anims.filter(a=>a.type==='drop').length; window.__trayIds=()=>tray.map(t=>t.id);
window.__pool={G,NET,shoot,netSnap,updateHUD,get S(){return S;},toScreen:(x,y)=>[M[0]*x+M[2]*y+M[4],M[1]*x+M[3]*y+M[5]],showWin,newGame,judge,advance,endShot,buildCandidates,evalCand,applyShot,shotCtx,FIX,
  autoTurn(noise){
    const cands=buildCandidates(), ctx=shotCtx();
    for(const c of cands) c.score=evalCand(c,ctx);
    cands.sort((a,b)=>b.score-a.score);
    const c=cands[0], L=noise?AI_LEVEL[noise]:null;
    if(c.pos&&G.bih){S.balls[0].x=c.pos.x; S.balls[0].y=c.pos.y;}
    const ang=c.angle+(L?gauss()*L.noise*Math.PI/180:0), pw=L?clamp(c.power*(1+gauss()*L.pnoise),0.05,1):c.power;
    if(ctx.wasOnEight) ctx.cp=c.cp==null?-1:c.cp;
    G.ctx=ctx; applyShot(S,ang,pw,0,c.sy||0); G.bih=null; G.phase='moving';
    let n=0; while(n<4800&&advance(S,FIX,null)) n++;
    endShot();
    return {score:c.score,n};
  }};
})();
</script>
