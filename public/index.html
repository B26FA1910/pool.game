<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Билльярд — 8 бөмбөг</title>
<style>
:root{
  --bg:#0c110f; --panel:#141b18; --panel2:#1b2420; --line:#2a3631; --text:#eef3ee; --muted:#93a39a; --accent:#e8b84f;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:radial-gradient(1200px 700px at 50% -10%,#1b2a23 0%,var(--bg) 62%);
  color:var(--text);font:14px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif;
  overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
}
#app{
  height:100vh;height:100dvh;display:flex;flex-direction:column;gap:8px;
  padding:calc(10px + env(safe-area-inset-top)) calc(12px + env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) calc(12px + env(safe-area-inset-left));
}
header{display:flex;align-items:center;gap:6px}
h1{font-size:17px;font-weight:750;letter-spacing:.2px;margin-right:auto;white-space:nowrap}
h1 span{color:var(--accent);font-weight:650}
.btn,select{
  height:34px;border-radius:9px;border:1px solid var(--line);background:var(--panel2);color:var(--text);
  font:inherit;padding:0 11px;cursor:pointer;touch-action:manipulation
}
select{padding:0 8px;max-width:178px}
.btn:hover,select:hover{border-color:#41524a}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#1d1606;font-weight:700}
.btn.icon{width:34px;padding:0;display:grid;place-items:center;font-size:16px}
.players{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pcard{
  background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:7px 10px;
  display:flex;align-items:center;gap:10px;min-width:0;opacity:.7;
  transition:border-color .2s,box-shadow .2s,opacity .2s
}
.pcard.active{opacity:1;border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent),0 0 22px -8px var(--accent)}
.pinfo{min-width:0}
.pname{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pgroup{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pballs{display:flex;gap:3px;margin-left:auto;flex-wrap:wrap;justify-content:flex-end}
.mini{width:15px;height:15px;border-radius:50%;box-shadow:inset -2px -2px 3px rgba(0,0,0,.35),0 0 0 1px rgba(0,0,0,.25)}
#msg{min-height:20px;text-align:center;font-size:14px;transition:color .2s}
#msg.foul{color:#ff9580}
#msg.good{color:#a6e9a6}
main{flex:1;min-height:0;display:flex;gap:10px}
#stage{flex:1;min-width:0;min-height:0;position:relative}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block;cursor:crosshair}
#side{width:84px;display:flex;flex-direction:column;align-items:center;gap:12px;padding:2px 0;transition:opacity .2s}
#side.disabled{opacity:.38;pointer-events:none}
.grp{display:flex;flex-direction:column;align-items:center;gap:5px}
.grp-power{flex:1;min-height:0;width:100%}
.lbl{font-size:11px;color:var(--muted);white-space:nowrap}
#power{
  position:relative;flex:1;width:46px;min-height:110px;border-radius:12px;overflow:hidden;
  background:#0b100e;border:1px solid var(--line);touch-action:none;cursor:ns-resize
}
#power::before{
  content:"";position:absolute;inset:0;
  background:repeating-linear-gradient(180deg,transparent 0 9.5%,rgba(255,255,255,.07) 9.5% 10%);
}
#powerFill{
  position:absolute;inset:0;background:linear-gradient(180deg,#3fbf6e,#e8b84f 55%,#e5533d);
  clip-path:inset(0 0 100% 0)
}
#powerHint{position:absolute;inset:0;display:grid;place-items:center;font-size:20px;color:rgba(255,255,255,.35);pointer-events:none}
#powerHint::after{content:"⇣"}
#spin{
  width:60px;height:60px;border-radius:50%;position:relative;touch-action:none;cursor:crosshair;flex:none;
  background:radial-gradient(circle at 35% 30%,#fff,#ebe7dc 55%,#b6b1a3);box-shadow:0 2px 10px rgba(0,0,0,.45)
}
#spin::before,#spin::after{content:"";position:absolute;background:rgba(0,0,0,.13)}
#spin::before{left:50%;top:12%;bottom:12%;width:1px}
#spin::after{top:50%;left:12%;right:12%;height:1px}
#spinDot{
  position:absolute;width:12px;height:12px;border-radius:50%;background:#d63b2f;left:50%;top:50%;
  transform:translate(-50%,-50%);box-shadow:0 0 0 2px rgba(255,255,255,.8);pointer-events:none
}
.aimbtns{display:flex;gap:6px}
body.portrait main{flex-direction:column}
body.portrait #side{width:auto;flex-direction:row;align-items:flex-end;padding:0;gap:12px}
body.portrait .grp-power{flex:1;min-width:0;width:auto}
body.portrait #power{flex:none;width:100%;height:46px;min-height:0;cursor:ew-resize}
body.portrait #power::before{background:repeating-linear-gradient(90deg,transparent 0 9.5%,rgba(255,255,255,.07) 9.5% 10%)}
body.portrait #powerFill{background:linear-gradient(90deg,#3fbf6e,#e8b84f 55%,#e5533d);clip-path:inset(0 100% 0 0)}
body.portrait #powerHint::after{content:"⇢"}
#overlay{position:fixed;inset:0;display:none;place-items:center;background:rgba(5,8,7,.64);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);z-index:10;padding:16px}
#overlay.show{display:grid}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px 22px;max-width:470px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.5);max-height:calc(100dvh - 32px);overflow:auto}
.card h2{font-size:19px;margin-bottom:12px}
.card ul{padding-left:18px;color:#cfd9d2;display:grid;gap:7px;font-size:13.5px}
.card b{color:var(--text)}
.card .row{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
.trophy{font-size:44px;text-align:center;margin-bottom:4px}
.card.win h2{text-align:center;font-size:22px;margin-bottom:6px}
.card .why{text-align:center;color:#cfd9d2}
.card.win .row{justify-content:center}
#netbar{display:none;align-items:center;justify-content:center;gap:10px;font-size:13px;color:var(--muted);min-height:22px}
#netbar.show{display:flex}
#netbar .dot{width:8px;height:8px;border-radius:50%;background:#e5533d;display:inline-block;margin-right:5px}
#netbar .dot.on{background:#3fbf6e}
#netbar b{color:var(--text);letter-spacing:1px}
#netbar .btn{height:26px;padding:0 10px;font-size:12px}
.fld{display:grid;gap:5px;font-size:12.5px;color:var(--muted);margin-bottom:12px}
.fld input,.joinrow input{height:38px;border-radius:9px;border:1px solid var(--line);background:#0e1412;color:var(--text);font:inherit;font-size:15px;padding:0 12px;outline:none;-webkit-user-select:text;user-select:text}
.fld input:focus,.joinrow input:focus{border-color:var(--accent)}
.sec{font-size:12px;color:var(--muted);margin:16px 0 7px;text-transform:uppercase;letter-spacing:.6px}
.ol-list{display:grid;gap:6px}
.ol-item{display:flex;align-items:center;gap:10px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:7px 8px 7px 12px}
.ol-item .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.ol-item .cd{color:var(--muted);font-size:12px}
.ol-empty{color:var(--muted);font-size:13px;padding:4px 2px}
.joinrow{display:flex;gap:8px}
.joinrow input{flex:1;min-width:0;letter-spacing:2px}
.btn.block{width:100%;height:40px}
.note{font-size:12.5px;color:var(--muted);margin-top:14px;line-height:1.45}
.note b{color:var(--text)}
.err{color:#ff9580;font-size:13px;margin-top:8px;min-height:1px}
@media (max-width:560px){
  h1 span,.wide{display:none}
  .pcard{flex-direction:column;align-items:flex-start;gap:4px;padding:6px 9px}
  .pballs{margin-left:0;justify-content:flex-start}
  .mini{width:13px;height:13px}
  select{max-width:150px}
}
@media (max-height:520px){
  #app{gap:5px;padding-top:calc(6px + env(safe-area-inset-top));padding-bottom:calc(6px + env(safe-area-inset-bottom))}
  .pcard{padding:4px 9px}
  .btn,select{height:30px}
  .btn.icon{width:30px}
  #spin{width:50px;height:50px}
  #side{gap:8px}
}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>Билльярд <span>· 8 бөмбөг</span></h1>
    <select id="mode" aria-label="Тоглох горим">
      <option value="ai1">Компьютер · хялбар</option>
      <option value="ai2" selected>Компьютер · дунд</option>
      <option value="ai3">Компьютер · хэцүү</option>
      <option value="pvp">2 тоглогч</option>
      <option value="online">🌐 Онлайн</option>
    </select>
    <button class="btn" id="newBtn" title="Шинэ тоглоом">⟲<span class="wide">&nbsp;Шинэ</span></button>
    <button class="btn icon" id="helpBtn" title="Тусламж">?</button>
    <button class="btn icon" id="muteBtn" title="Дуу">🔊</button>
  </header>
  <div class="players">
    <div class="pcard" id="p0"><div class="pinfo"><div class="pname"></div><div class="pgroup"></div></div><div class="pballs"></div></div>
    <div class="pcard" id="p1"><div class="pinfo"><div class="pname"></div><div class="pgroup"></div></div><div class="pballs"></div></div>
  </div>
  <div id="netbar"><span id="netTxt"></span><button class="btn" id="netLeave">Гарах</button></div>
  <div id="msg"></div>
  <main>
    <div id="stage"><canvas id="cv"></canvas></div>
    <div id="side">
      <div class="grp grp-power"><div class="lbl">Хүч</div><div id="power"><div id="powerFill"></div><div id="powerHint"></div></div></div>
      <div class="grp"><div class="lbl">Эргэлт</div><div id="spin" title="Давхар дарвал цэвэрлэнэ"><div id="spinDot"></div></div></div>
      <div class="grp"><div class="lbl">Онилох</div><div class="aimbtns"><button class="btn icon" id="rotL" title="Зүүн тийш эргүүлэх">↺</button><button class="btn icon" id="rotR" title="Баруун тийш эргүүлэх">↻</button></div></div>
    </div>
  </main>
</div>
<div id="overlay"><div class="card" id="ovCard"></div></div>

<script>
(()=>{
'use strict';
/* ================= constants ================= */
const W=1000,H=500,R=11,RAIL=50,CW=16;
const CG=41,CRC=16,CWALL=26;   // corner pocket: rail end, rounded jaw radius, throat wall
const SG=39,SRC=14,SWALL=12;   // middle pocket: rail end (from centre), jaw radius, wall
const FIX=1/120,MAXV=2300,FR_C=100,FR_L=0.3,STOP_V=4,E_BALL=0.97,E_RAIL=0.8,SLIP_K=1000,ROLL=0.28;
const STRIKE_MS=90;
const HEAD_X=W/4, FOOT={x:W*0.75,y:H/2}, HEAD={x:W/4-30,y:H/2};
const TAU=Math.PI*2;
const COLORS=['#f7f4ec','#f2c21b','#1f4fd1','#d6262b','#5a2d8c','#f07a14','#11804a','#7c1d22','#151515','#f2c21b','#1f4fd1','#d6262b','#5a2d8c','#f07a14','#11804a','#7c1d22'];
const groupOf=id=>id===0?'cue':id===8?'eight':(id<8?'solid':'stripe');
const GNAME={solid:'Бүтэн (1–7)',stripe:'Судалтай (9–15)'};
const clamp=(v,a,b)=>v<a?a:v>b?b:v;

/* cushions: straight rail + rounded (snooker-style) jaw at each end */
function jawPts(S,u,o,corner){
  const rc=corner?CRC:SRC, th=corner?Math.PI/4:Math.PI/2, L=corner?CWALL:SWALL, n=corner?6:9, pts=[];
  for(let i=0;i<=n;i++){
    const f=th*i/n, su=rc*Math.sin(f), so=rc*(1-Math.cos(f));
    pts.push([S[0]+u[0]*su+o[0]*so, S[1]+u[1]*su+o[1]*so]);
  }
  const e=pts[n], d=[u[0]*Math.cos(th)+o[0]*Math.sin(th), u[1]*Math.cos(th)+o[1]*Math.sin(th)];
  pts.push([e[0]+d[0]*L, e[1]+d[1]*L]);
  return pts;
}
const RAILS=[
  {a:[CG,0],ua:[-1,0],ca:true,  b:[W/2-SG,0],ub:[1,0],cb:false, o:[0,-1]},
  {a:[W/2+SG,0],ua:[-1,0],ca:false, b:[W-CG,0],ub:[1,0],cb:true, o:[0,-1]},
  {a:[CG,H],ua:[-1,0],ca:true,  b:[W/2-SG,H],ub:[1,0],cb:false, o:[0,1]},
  {a:[W/2+SG,H],ua:[-1,0],ca:false, b:[W-CG,H],ub:[1,0],cb:true, o:[0,1]},
  {a:[0,CG],ua:[0,-1],ca:true, b:[0,H-CG],ub:[0,1],cb:true, o:[-1,0]},
  {a:[W,CG],ua:[0,-1],ca:true, b:[W,H-CG],ub:[0,1],cb:true, o:[1,0]},
].map(r=>{
  const ja=jawPts(r.a,r.ua,r.o,r.ca), jb=jawPts(r.b,r.ub,r.o,r.cb);
  return Object.assign(r,{ja,jb,nose:ja.slice().reverse().concat(jb)});
});
const SEGS=[];
function addSeg(p,q){
  const dx=q[0]-p[0],dy=q[1]-p[1];
  SEGS.push({ax:p[0],ay:p[1],dx,dy,l2:dx*dx+dy*dy,
    minx:Math.min(p[0],q[0])-R,maxx:Math.max(p[0],q[0])+R,miny:Math.min(p[1],q[1])-R,maxy:Math.max(p[1],q[1])+R});
}
for(const r of RAILS) for(let i=0;i<r.nose.length-1;i++) addSeg(r.nose[i],r.nose[i+1]);
const POCKETS=[
  {x:-12,y:-12,r:25,ax:-3,ay:-3,side:false},
  {x:W/2,y:-17,r:21,ax:W/2,ay:-6,side:true},
  {x:W+12,y:-12,r:25,ax:W+3,ay:-3,side:false},
  {x:-12,y:H+12,r:25,ax:-3,ay:H+3,side:false},
  {x:W/2,y:H+17,r:21,ax:W/2,ay:H+6,side:true},
  {x:W+12,y:H+12,r:25,ax:W+3,ay:H+3,side:false},
];

/* ================= physics ================= */
const newShot=()=>({firstHit:null,pocketed:[],t:0});
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;}
function rack(){
  const balls=[];
  for(let id=0;id<16;id++) balls.push({id,x:0,y:0,vx:0,vy:0,on:true,sx:0,slip:0});
  balls[0].x=HEAD.x; balls[0].y=HEAD.y;
  const d=2*R+0.12, dx=d*Math.sqrt(3)/2, pos=[];
  for(let r=0;r<5;r++) for(let j=0;j<=r;j++) pos.push({x:FOOT.x+r*dx,y:FOOT.y+(j-r/2)*d});
  const idx=(r,j)=>r*(r+1)/2+j;
  const solids=shuffle([1,2,3,4,5,6,7]), stripes=shuffle([9,10,11,12,13,14,15]);
  const slots=new Array(15).fill(0);
  slots[idx(2,1)]=8;
  const flip=Math.random()<0.5;
  slots[idx(4,0)]=flip?solids.pop():stripes.pop();
  slots[idx(4,4)]=flip?stripes.pop():solids.pop();
  const rest=shuffle(solids.concat(stripes));
  for(let k=0;k<15;k++) if(!slots[k]) slots[k]=rest.pop();
  for(let k=0;k<15;k++){const b=balls[slots[k]]; b.x=pos[k].x; b.y=pos[k].y;}
  return balls;
}
function sink(S,b,p,ev){
  b.on=false; const x=b.x,y=b.y; b.vx=0; b.vy=0;
  S.shot.pocketed.push(b.id);
  if(ev) ev.sinks.push({id:b.id,x,y,px:p.x,py:p.y});
}
function substep(S,h,ev){
  const B=S.balls, sh=S.shot;
  for(let i=0;i<16;i++){
    const b=B[i]; if(!b.on) continue;
    const vx=b.vx,vy=b.vy; if(vx===0&&vy===0) continue;
    const sp=Math.sqrt(vx*vx+vy*vy), ns=sp-(FR_C+FR_L*sp)*h;
    if(ns<=STOP_V){b.vx=0;b.vy=0;if(i===0)b.slip=0;continue;}
    const k=ns/sp; b.vx=vx*k; b.vy=vy*k; b.x+=b.vx*h; b.y+=b.vy*h;
    if(i===0){
      if(b.slip>0) b.slip=Math.max(0,b.slip-SLIP_K*h); else if(b.slip<0) b.slip=Math.min(0,b.slip+SLIP_K*h);
      b.sx*=1-0.35*h;
    }
  }
  const D=2*R, D2=D*D;
  for(let i=0;i<15;i++){
    const a=B[i]; if(!a.on) continue;
    for(let j=i+1;j<16;j++){
      const b=B[j]; if(!b.on) continue;
      if(a.vx===0&&a.vy===0&&b.vx===0&&b.vy===0) continue;
      const dx=b.x-a.x, dy=b.y-a.y;
      if(dx>D||dx<-D||dy>D||dy<-D) continue;
      const d2=dx*dx+dy*dy; if(d2>=D2||d2<1e-9) continue;
      const d=Math.sqrt(d2), nx=dx/d, ny=dy/d, ov=(D-d)/2;
      a.x-=nx*ov; a.y-=ny*ov; b.x+=nx*ov; b.y+=ny*ov;
      const rv=(a.vx-b.vx)*nx+(a.vy-b.vy)*ny; if(rv<=0) continue;
      const pvx=a.vx,pvy=a.vy, imp=rv*(1+E_BALL)/2;
      a.vx-=imp*nx; a.vy-=imp*ny; b.vx+=imp*nx; b.vy+=imp*ny;
      if(i===0&&sh.firstHit===null){
        sh.firstHit=b.id;
        const ps=Math.sqrt(pvx*pvx+pvy*pvy);
        if(ps>1){
          const ux=pvx/ps,uy=pvy/ps, full=Math.abs(ux*nx+uy*ny);
          const s=clamp(ROLL+a.slip/ps,-1.3,1.3), add=ps*s*0.55*full;
          a.vx+=ux*add; a.vy+=uy*add;
        }
        a.slip=0;
      }
      if(ev) ev.snd.push(1,rv);
    }
  }
  for(let i=0;i<16;i++){
    const b=B[i]; if(!b.on) continue;
    if(b.vx===0&&b.vy===0) continue;
    if(b.x>R+1&&b.x<W-R-1&&b.y>R+1&&b.y<H-R-1) continue;
    for(let k=0;k<SEGS.length;k++){
      const s=SEGS[k];
      if(b.x<s.minx||b.x>s.maxx||b.y<s.miny||b.y>s.maxy) continue;
      let t=((b.x-s.ax)*s.dx+(b.y-s.ay)*s.dy)/s.l2; t=t<0?0:t>1?1:t;
      const ex=b.x-(s.ax+t*s.dx), ey=b.y-(s.ay+t*s.dy), d2=ex*ex+ey*ey;
      if(d2>=R*R||d2<1e-12) continue;
      const d=Math.sqrt(d2), nx=ex/d, ny=ey/d;
      b.x+=nx*(R-d); b.y+=ny*(R-d);
      const vn=b.vx*nx+b.vy*ny; if(vn>=0) continue;
      b.vx-=(1+E_RAIL)*vn*nx; b.vy-=(1+E_RAIL)*vn*ny;
      if(i===0&&b.sx){const add=b.sx*(-vn)*0.35; b.vx+=ny*add; b.vy-=nx*add; b.sx*=0.7;}
      if(ev) ev.snd.push(2,-vn);
    }
    for(let k=0;k<6;k++){
      const p=POCKETS[k], dx=b.x-p.x, dy=b.y-p.y;
      if(dx*dx+dy*dy<p.r*p.r){sink(S,b,p,ev);break;}
    }
    if(b.on&&(b.x<-3*R||b.x>W+3*R||b.y<-3*R||b.y>H+3*R)){
      let best=POCKETS[0],bd=Infinity;
      for(const p of POCKETS){const q=(b.x-p.x)**2+(b.y-p.y)**2; if(q<bd){bd=q;best=p;}}
      sink(S,b,best,ev);
    }
  }
}
function advance(S,dt,ev){
  const B=S.balls; let mv=0;
  for(let i=0;i<16;i++){const b=B[i]; if(b.on){const v=Math.abs(b.vx)+Math.abs(b.vy); if(v>mv) mv=v;}}
  if(mv===0) return false;
  const n=Math.min(48,Math.max(1,Math.ceil(mv*dt/(R*0.45)))), h=dt/n;
  for(let k=0;k<n;k++) substep(S,h,ev);
  return true;
}
function applyShot(S,angle,power,sx,sy){
  const c=S.balls[0], v=MAXV*Math.pow(clamp(power,0,1),1.3);
  c.vx=Math.cos(angle)*v; c.vy=Math.sin(angle)*v; c.sx=sx||0; c.slip=v*((sy||0)-ROLL);
  S.shot=newShot();
}

/* ================= rules ================= */
function legalIds(S,grp){
  const B=S.balls, r=[];
  for(let i=1;i<16;i++){
    if(i===8||!B[i].on) continue;

/* ================= AI ================= */
const AI_LEVEL={ai1:{noise:2.0,pnoise:.12,sloppy:.4},ai2:{noise:0.75,pnoise:.06,sloppy:.12},ai3:{noise:0.28,pnoise:.03,sloppy:0}};
function pathClear(St,x1,y1,x2,y2,ia,ib,rad){
  const dx=x2-x1,dy=y2-y1,l2=dx*dx+dy*dy||1,r2=rad*rad;
  for(const b of St.balls){
    if(!b.on||b.id===ia||b.id===ib) continue;
    let t=((b.x-x1)*dx+(b.y-y1)*dy)/l2; t=t<0?0:t>1?1:t;
    const ex=b.x-(x1+t*dx),ey=b.y-(y1+t*dy);
    if(ex*ex+ey*ey<r2) return false;
  }
  return true;
}
function shotEase(St,cx,cy,b,p){
  const ux=p.ax-b.x,uy=p.ay-b.y,dp=Math.hypot(ux,uy); if(dp<1) return null;
  const nx=ux/dp,ny=uy/dp;
  if(p.side&&Math.abs(ny)<0.42) return null;
  const gx=b.x-nx*2*R,gy=b.y-ny*2*R;
  if(gx<R-1||gx>W-R+1||gy<R-1||gy>H-R+1) return null;
  const ax=gx-cx,ay=gy-cy,da=Math.hypot(ax,ay); if(da<1) return null;
  const cs=(ax*nx+ay*ny)/da; if(cs<0.25) return null;
  if(!pathClear(St,cx,cy,gx,gy,0,b.id,2*R-0.5)) return null;
  if(!pathClear(St,b.x,b.y,p.ax,p.ay,0,b.id,2*R-0.5)) return null;
  return {ease:cs*cs/(1+(da+dp)/900),angle:Math.atan2(ay,ax),dist:da+dp};
}
function bestEaseFor(St,grp,cx,cy){
  let best=0;
  for(const id of legalIds(St,grp)){
    const b=St.balls[id];
    for(const p of POCKETS){const e=shotEase(St,cx,cy,b,p); if(e&&e.ease>best) best=e.ease;}
  }
  return best;
}
function aiScore(S2,ctx){
  const rec=S2.shot,out=judge(ctx,rec),p=ctx.p,o=1-p;
  if(out.win!==null) return out.win===p?1e5:-1e5;
  const cue=S2.balls[0]; let s=0;
  if(out.foul) s-=450;
  else if(out.cont){
    const g=out.groups[p];
    const n=rec.pocketed.filter(id=>id!==0&&id!==8&&(!g||groupOf(id)===g)).length;
    s+=300+40*n+260*bestEaseFor(S2,g,cue.x,cue.y);
  }else s-=150*bestEaseFor(S2,out.groups[o],cue.x,cue.y);
  const og=out.groups[o]; if(og) s-=12*rec.pocketed.filter(id=>groupOf(id)===og).length;
  return s;
}
function evalCand(c,ctx){
  const S2={balls:S.balls.map(b=>({...b})),shot:newShot()};
  if(c.pos){const q=S2.balls[0]; q.x=c.pos.x; q.y=c.pos.y; q.on=true; q.vx=q.vy=0;}
  applyShot(S2,c.angle,c.power,0,c.sy||0);
  for(let n=0;n<4800&&advance(S2,FIX,null);n++);
  return aiScore(S2,ctx);
}
function buildCandidates(){
  const grp=G.groups[G.cur], ids=legalIds(S,grp), cue=S.balls[0], cands=[];
  if(G.isBreak){
    let apex=null,bd=Infinity;
    for(const b of S.balls){if(b.id&&b.on){const d=(b.x-cue.x)**2+(b.y-cue.y)**2; if(d<bd){bd=d;apex=b;}}}
    const a=Math.atan2(apex.y-cue.y,apex.x-cue.x);
    for(const da of [0,0.004,-0.004]) cands.push({pos:null,angle:a+da,power:1});
    return cands;
  }
  let positions=[{x:cue.x,y:cue.y,fixed:true}];
  if(G.bih){
    const kitchen=G.bih==='kitchen', opts=[];
    for(const id of ids){
      const b=S.balls[id];
      for(const p of POCKETS){
        const ux=p.ax-b.x,uy=p.ay-b.y,dp=Math.hypot(ux,uy),nx=ux/dp,ny=uy/dp;
        const gx=b.x-nx*2*R,gy=b.y-ny*2*R;
        for(const D of [90,170,260]) for(const off of [0,0.35,-0.35]){
          const ca=Math.cos(off),sa=Math.sin(off), dx=-nx*ca+ny*sa, dy=-nx*sa-ny*ca;

        }

  const pairs=[];
  for(const pos of positions) for(const id of ids) for(const p of POCKETS){
    const e=shotEase(S,pos.x,pos.y,S.balls[id],p); if(e) pairs.push({pos,e});
  }
  pairs.sort((a,b)=>b.e.ease-a.e.ease);
  pairs.slice(0,14).forEach((pr,k)=>{
    const pos=pr.pos.fixed?null:pr.pos;
    for(const pw of [0.3,0.45,0.62,0.85]) cands.push({pos,angle:pr.e.angle,power:pw,sy:0});
    if(k<6){cands.push({pos,angle:pr.e.angle,power:0.5,sy:-0.7}); cands.push({pos,angle:pr.e.angle,power:0.5,sy:0.6});}

  if(cands.length<6) for(let k=0;k<24;k++) cands.push({pos:null,angle:k/24*TAU,power:0.5,sy:0});
  return cands;

function gauss(){let u=0,v=0; while(!u)u=Math.random(); while(!v)v=Math.random(); return Math.sqrt(-2*Math.log(u))*Math.cos(TAU*v);}

function startAI(){
  G.phase='ai'; const tok=++aiToken; updateHUD();
  setMsg('Компьютер бодож байна…');
  const t0=performance.now(), cands=buildCandidates(), ctx=shotCtx(); let i=0;
  const chunk=()=>{
    if(tok!==aiToken) return;
    const end=performance.now()+12;
    while(i<cands.length&&performance.now()<end){const c=cands[i++]; c.score=evalCand(c,ctx);}
    if(i<cands.length){setTimeout(chunk,0);return;}
    cands.sort((a,b)=>b.score-a.score);
    const L=AI_LEVEL[G.mode]||AI_LEVEL.ai2;
    let pick=cands[0];
    if(L.sloppy&&cands.length>2&&Math.random()<L.sloppy) pick=cands[1+(Math.random()*Math.min(3,cands.length-1)|0)];
    setTimeout(()=>{if(tok===aiToken) executeAI(pick,L,tok);},Math.max(0,700-(performance.now()-t0)));
  };

}
function executeAI(c,L,tok){
  const cue=S.balls[0];
  if(c.pos&&G.bih&&validPos(c.pos.x,c.pos.y,G.bih==='kitchen',0)){cue.x=c.pos.x; cue.y=c.pos.y;}
  const target=c.angle+gauss()*L.noise*Math.PI/180;
  const power=clamp(c.power*(1+gauss()*L.pnoise),0.05,1);
  G.spin={x:0,y:c.sy||0}; updateSpinUI();

  const a0=G.aim, d=angDiff(target,a0), t0=performance.now(), dur=380+Math.min(600,Math.abs(d)*500);

    G.aim=a0+d*e;

    const t1=performance.now();
    const st=()=>{
      if(tok!==aiToken) return;
      const k=Math.min(1,(performance.now()-t1)/450); G.power=power*k;
      if(k<1) requestAnimationFrame(st); else setTimeout(()=>{if(tok===aiToken) shoot();},140);
    };

const NET={via:'none',lobby:null,state:'pending',game:null,code:null,seat:null,gen:-1,seq:-1,connected:false,

function cleanName(v){return String(v||'').replace(/[\u0000-\u001f\u007f-\u009f­​-‏‪-‮⁠-⁯﻿]/g,'').trim().slice(0,16);}

    gr:[G.groups[0]||0,G.groups[1]||0],br:G.isBreak?1:0,h:G.bih||0,w:G.wins.slice(),win:G.winner==null?-1:G.winner};

function validSnap(s){

  if(!Array.isArray(s.b)||s.b.length!==16) return false;

function netRound(){for(const b of S.balls) if(b.on){b.x=r3(b.x); b.y=r3(b.y);}}

function netNewGame(gen){
  S={balls:rack(),shot:newShot()}; netRound();
  Object.assign(G,{cur:gen%2,groups:[null,null],isBreak:true,phase:'aim',bih:'kitchen',power:0,spin:{x:0,y:0},winner:null,strike:null,charging:null});
  NET.gen=gen; NET.seq=0; NET.played=''; NET.authSeat=NET.seat; anims.length=0;
  autoAim(); updateSpinUI(); if(!olOpen) hideOverlay(); netTurnMsg('Шинэ тоглоом. '); updateHUD(); netPublish();
}
function netOwnShot(s){
  netRound();
  const pre=netSnap();
  applyShot(S,s.angle,s.power,s.sx,s.sy);
  const c=S.balls[0]; c.vx=r4(c.vx); c.vy=r4(c.vy); c.sx=r4(c.sx); c.slip=r4(c.slip);
  NET.curSeq=NET.seq+1; NET.remoteBy=-1; NET.played=NET.gen+':'+NET.curSeq;
  netPres({sh:{g:NET.gen,q:NET.curSeq,pre,vx:c.vx,vy:c.vy,sx:c.sx,sl:c.slip,a:r4(s.angle),p:r4(s.power)},live:null});
  NET.liveK='';
}
function netStartRemote(sh,by){
  const newGen=sh.g!==NET.gen;
  NET.played=sh.g+':'+sh.q; NET.curSeq=sh.q; NET.remoteBy=by;
  netLoad(sh.pre);
  if(newGen&&!olOpen) hideOverlay();
  const pw=clamp(sh.p,0,1);
  G.ctx=shotCtx(); G.aim=sh.a; G.power=pw; G.charging=null;
  G.strike={t0:performance.now(),angle:sh.a,power:pw,sx:sh.sx,sy:0,remote:sh};
  G.phase='strike'; updateHUD();
}
function netAfterShot(){
  NET.seq=NET.curSeq; netRound();
  const by=NET.remoteBy; NET.remoteBy=-1;
  NET.authSeat=by===-1?NET.seat:by;
  netPublish();
  if(by===0||by===1){
    const p=netPeerSeat(by), st=p&&p.presence.st;
    if(st&&validSnap(st)&&st.g===NET.gen&&st.q===NET.seq&&JSON.stringify(st)!==JSON.stringify(netSnap())){NET.fixes=(NET.fixes||0)+1; netAdopt(st,by);}
  }
}
const netBusy=()=>G.phase==='strike'||G.phase==='moving';
function netCheck(){
  if(!NET.game||NET.seat===null||netBusy()) return;
  // newest table state published by a player
  let st=null,stBy=-1;
  for(const seat of [0,1]){
    if(seat===NET.seat) continue;
    const p=netPeerSeat(seat), s2=p&&p.presence.st;
    if(!validSnap(s2)) continue;
    if(!st||s2.g>st.g||(s2.g===st.g&&s2.q>st.q)){st=s2;stBy=seat;}
  }
  // 1) a shot that is newer than every published state -> replay it exactly
  let best=null,bestBy=-1;
  for(const seat of [0,1]){
    if(seat===NET.seat) continue;
    const p=netPeerSeat(seat), sh=p&&p.presence.sh;
    if(!validShot(sh)||sh.pre.c!==seat) continue;
    if(sh.g+':'+sh.q===NET.played) continue;
    if(sh.g<NET.gen||(sh.g===NET.gen&&sh.q<=NET.seq)) continue;
    if(st&&(st.g>sh.g||(st.g===sh.g&&st.q>=sh.q))) continue;
    if(!best||sh.g<best.g||(sh.g===best.g&&sh.q<best.q)){best=sh;bestBy=seat;}
  }
  if(best){netStartRemote(best,bestBy); return;}
  // 2) adopt a newer (or authoritative) table state
  if(st){
    if(st.g>NET.gen||(st.g===NET.gen&&st.q>NET.seq)) netAdopt(st,stBy);
    else if(st.g===NET.gen&&st.q===NET.seq&&(st.q===0?stBy===0:stBy===NET.authSeat)&&stBy!==NET.seat
      &&JSON.stringify(st)!==JSON.stringify(netSnap())) netAdopt(st,stBy);
  }else if(NET.gen<0&&NET.seat===0){
    netNewGame(0);
  }
}
function netSeat(){
  if(!NET.game) return;
  const me=NET.peers.find(p=>p.sameTab);
  if(NET.seat===null){
    const t0=!!netPeerSeat(0), t1=!!netPeerSeat(1);
    const others=NET.peers.filter(p=>!p.sameTab&&p.kind==='viewer');
    const waitingForSeats=others.some(p=>!p.presence||p.presence.seat===undefined);
    if((!others.length||waitingForSeats)&&performance.now()-NET.joinT<2500) return;
    NET.seat=!t0?0:(!t1?1:-1);
    netPres({v:1,name:NET.name||null,seat:NET.seat});
    if(NET.seat===-1) setMsg('Өрөө дүүрсэн тул та үзэгчээр орлоо.');
    netLobbyPres(); updateHUD();
  }else if((NET.seat===0||NET.seat===1)&&me){
    const rivals=netPeersOfSeat(NET.seat);
    if(rivals.some(r=>r.peer<me.peer)){
      const other=1-NET.seat;
      NET.seat=netPeerSeat(other)?-1:other;
      netPublish(); netLobbyPres(); updateHUD();
    }
  }
}
function netOnPeers(){
  netSeat();
  const opp=netOpp();
  if(NET.seat===0||NET.seat===1){
    if(opp&&!NET.hadOpp){
      sfx('cue',0.3);
      if(!netBusy()&&G.phase!=='over'&&G.phase!=='wait') netTurnMsg(`${netName(1-NET.seat)} нэгдлээ! `);
    }else if(!opp&&NET.hadOpp){
      setMsg(`Өрсөлдөгч гарлаа. Эргэж орохыг хүлээж байна (код ${NET.code}).`,'foul');
    }
  }
  NET.hadOpp=!!opp;
  netLobbyPres(); netCheck(); updateHUD();
}
function netLobbyPres(){
  if(!NET.lobby) return;
  const host=NET.game&&NET.seat===0?NET.code:null, open=!!host&&!netOpp();
  const p={name:NET.name||null,host,open};
  const k=JSON.stringify(p); if(k===NET.lobbyK) return; NET.lobbyK=k;
  NET.lobby.presence(p).catch(()=>{});
}
function netFail(){
  if(!NET.game) return;
  netLeave();
  G.mode=prevMode; modeSel.value=prevMode; G.wins=[0,0]; newGame();
  setMsg('Онлайн холболт тасарлаа.','foul');
}
async function netEnter(code,seat){
  const errEl=document.getElementById('olErr');
  if(!NET.lobby){ if(errEl) errEl.textContent='Онлайн холболт алга.'; return; }
  let room;
  try{ room=await NET.lobby.join('pool-'+code); }
  catch(e){ if(errEl) errEl.textContent='Өрөөнд холбогдож чадсангүй. Дахин оролдоно уу.'; return; }
  if(NET.game&&NET.game!==room) netLeave();
  aiToken++;
  Object.assign(NET,{game:room,code,seat,gen:-1,seq:-1,played:'',peers:[],hadOpp:false,authSeat:0,liveK:'',joinT:performance.now()});
  NET.connected=room.connected();
  G.mode='online'; modeSel.value='online'; G.wins=[0,0];
  NET.unsub=[
    room.onPeers(ch=>{NET.peers=ch.peers; netOnPeers();},()=>netFail()),
    room.onConnection(c=>{NET.connected=c; updateHUD();},()=>netFail()),
  ];
  hideOverlay();
  if(seat===0){ netNewGame(0); }
  else{
    S={balls:rack(),shot:newShot()}; G.phase='wait'; G.strike=null; G.charging=null; G.power=0;
    setMsg('Өрөөнд холбогдож байна…'); netPres({v:1,name:NET.name||null});
  }
  netLobbyPres(); updateHUD();
}
function netLeave(){
  if(NET.unsub) NET.unsub.forEach(f=>{try{f();}catch(_){}});
  NET.unsub=null;
  if(NET.game){const r=NET.game; NET.game=null; r.leave().catch(()=>{});}
  Object.assign(NET,{seat:null,code:null,peers:[],hadOpp:false,gen:-1,seq:-1});
  netLobbyPres();
}
function netTick(now){
  if(!NET.game) return;
  if(now-NET.checkT>300){NET.checkT=now; netSeat(); netCheck();}
  if(G.phase!=='aim') return;
  if(G.cur===NET.seat){
    if(now-NET.liveT>70){
      const c=S.balls[0], live={a:r4(G.aim),p:r3(G.power),c:G.bih?[r3(c.x),r3(c.y)]:0,s:[r3(G.spin.x),r3(G.spin.y)]};
      const k=JSON.stringify(live);
      if(k!==NET.liveK){NET.liveK=k; NET.liveT=now; netPres({live});}
    }
  }else{
    const p=netPeerSeat(G.cur), L=p&&p.presence.live;
    if(L&&typeof L==='object'&&isNum(L.a)&&isNum(L.p)){
      G.aim=L.a; G.power=clamp(L.p,0,1);
      const c=S.balls[0];
      if(G.bih&&Array.isArray(L.c)&&isNum(L.c[0])&&isNum(L.c[1])){c.x=clamp(L.c[0],R,W-R); c.y=clamp(L.c[1],R,H-R);}
      if(Array.isArray(L.s)&&isNum(L.s[0])&&isNum(L.s[1])&&(L.s[0]!==G.spin.x||L.s[1]!==G.spin.y)){
        G.spin={x:clamp(L.s[0],-1,1),y:clamp(L.s[1],-1,1)}; updateSpinUI();
      }
    }
  }
}

/* Own server (Cloudflare Worker + Durable Object at /ws): same calls as the claude.ai room */
function netRid(){
  const abc='abcdefghijklmnopqrstuvwxyz0123456789', r=new Uint8Array(16);
  try{crypto.getRandomValues(r);}catch(_){for(let i=0;i<16;i++) r[i]=Math.random()*256|0;}
  let s=''; for(const x of r) s+=abc[x%36]; return s;
}
function wsRoom(name,me){
  const base=(location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws';
  let ws=null,alive=true,connected=false,tries=0,pingT=null,my={},frozen=Object.freeze([]),queued=false;
  const others=new Map(), ph=new Set(), chs=new Set();
  const peerObj=(peer,presence,t,mine)=>Object.freeze({peer,by:null,isMe:mine,sameTab:mine,kind:'viewer',guest:false,presence,updatedAt:t});
  const snap=()=>{
    const arr=[peerObj(me,Object.freeze({...my}),Date.now(),true)];
    for(const [peer,v] of others) arr.push(peerObj(peer,v.p,v.t,false));
    return Object.freeze(arr);
  };
  const notify=()=>{
    if(queued) return; queued=true;
    setTimeout(()=>{queued=false; frozen=snap(); const c={peers:frozen,joined:[],left:[],updated:[]}; for(const h of ph){try{h(c);}catch(e){console.error(e);}}},0);
  };
  const setConn=v=>{if(v===connected) return; connected=v; for(const h of chs){try{h(v);}catch(_){}}};
  const send=o=>{if(ws&&ws.readyState===1){try{ws.send(JSON.stringify(o));}catch(_){}}};
  const merge=(base,d)=>{const n={...base}; for(const k of Object.keys(d)){ if(d[k]===null) delete n[k]; else n[k]=d[k]; } return n;};
  function open(){
    if(!alive) return;
    try{ ws=new WebSocket(base+'?room='+encodeURIComponent(name)+'&peer='+me); }catch(_){ setTimeout(open,2000); return; }
    ws.onopen=()=>{
      tries=0; send({t:'u',d:my});
      clearInterval(pingT); pingT=setInterval(()=>{if(ws&&ws.readyState===1) ws.send('ping');},25000);
    };
    ws.onmessage=e=>{
      if(e.data==='pong') return;
      let m; try{m=JSON.parse(e.data);}catch(_){return;}
      if(!m||typeof m!=='object') return;
      if(m.t==='welcome'&&Array.isArray(m.peers)){
        others.clear();
        for(const p of m.peers) if(p&&typeof p.peer==='string'&&p.peer!==me) others.set(p.peer,{p:Object.freeze(p.p&&typeof p.p==='object'?p.p:{}),t:Date.now()});
        setConn(true); notify();
      }else if(m.t==='u'&&typeof m.peer==='string'&&m.peer!==me&&m.d&&typeof m.d==='object'){
        const cur=others.get(m.peer);
        others.set(m.peer,{p:Object.freeze(merge(cur?cur.p:{},m.d)),t:Date.now()}); notify();
      }else if(m.t==='leave'&&typeof m.peer==='string'){
        if(others.delete(m.peer)) notify();
      }
    };
    ws.onclose=()=>{
      clearInterval(pingT); setConn(false);
      if(alive) setTimeout(open,Math.min(8000,500*2**tries++));
    };
    ws.onerror=()=>{};
  }
  open();
  return {
    name,
    presence:async patch=>{my=merge(my,patch); send({t:'u',d:patch}); notify();},
    peers:()=>frozen,
    onPeers:h=>{ph.add(h); setTimeout(()=>{frozen=snap(); h({peers:frozen,joined:frozen,left:[],updated:[]});},0); return ()=>ph.delete(h);},
    connected:()=>connected,
    onConnection:h=>{chs.add(h); setTimeout(()=>h(connected),0); return ()=>chs.delete(h);},
    emit:async()=>{}, on:()=>()=>{},
    leave:async()=>{alive=false; clearInterval(pingT); try{ws&&ws.close(1000);}catch(_){} setConn(false);},
    join:async n=>{ if(!/^[a-z0-9][a-z0-9_.-]{0,47}$/.test(n)) throw {code:'invalid_argument',message:'room name'}; return wsRoom(n,me); },
  };
}
function wsLobby(){
  return new Promise(res=>{
    const r=wsRoom('lobby',netRid()); let done=false;
    const un=r.onConnection(c=>{if(c&&!done){done=true; res(r);}});
    setTimeout(()=>{if(!done){done=true; un(); r.leave(); res(null);}},6000);
  });
}
(async()=>{

})();

let AC=null,muted=false; const lastSnd={};
function audio(){
  try{
    if(!AC){const C=window.AudioContext||window.webkitAudioContext; if(C) AC=new C();}
    if(AC&&AC.state==='suspended') AC.resume();
  }catch(e){}
}
function blip(f,d,v,type){
  if(!AC||muted||v<0.003) return;
  try{
    const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();
    o.type=type||'sine'; o.frequency.setValueAtTime(f,t); o.frequency.exponentialRampToValueAtTime(Math.max(40,f*0.55),t+d);
    g.gain.setValueAtTime(Math.min(0.9,v),t); g.gain.exponentialRampToValueAtTime(0.0001,t+d);
    o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+d+0.03);
  }catch(e){}
}
function sfx(kind,v){
  const now=performance.now(); if(now-(lastSnd[kind]||0)<28) return; lastSnd[kind]=now;
  if(kind==='ball'){const a=Math.min(1,v/1400); blip(2600+Math.random()*500,0.045,0.5*a,'sine'); blip(1300,0.03,0.22*a,'triangle');}
  else if(kind==='rail'){blip(170,0.11,0.45*Math.min(1,v/1600),'sine');}
  else if(kind==='pocket'){blip(140,0.22,0.5,'triangle'); blip(85,0.3,0.4,'sine');}
  else if(kind==='cue'){blip(950,0.05,0.2+0.4*v,'triangle');}
}
const EV={snd:[],sinks:[]};
function playEvents(){
  let bb=0,br=0;
  for(let i=0;i<EV.snd.length;i+=2){const k=EV.snd[i],v=EV.snd[i+1]; if(k===1){if(v>bb)bb=v;}else if(v>br)br=v;}
  if(bb>20) sfx('ball',bb);
  if(br>30) sfx('rail',br);
  const now=performance.now();
  for(const s of EV.sinks){sfx('pocket'); anims.push({...s,t0:now});}
  if(EV.sinks.length) updateHUD();
  EV.snd.length=0; EV.sinks.length=0;
}

const $=s=>document.querySelector(s);
const cv=$('#cv'), g2=cv.getContext('2d'), stage=$('#stage');
const tableCv=document.createElement('canvas');
let dpr=1,M=[1,0,0,1,0,0],portrait=false,scale=1,sprites=[];
const anims=[];
function setT(g){g.setTransform(M[0]*dpr,M[1]*dpr,M[2]*dpr,M[3]*dpr,M[4]*dpr,M[5]*dpr);}
const scr=(x,y)=>[(M[0]*x+M[2]*y+M[4])*dpr,(M[1]*x+M[3]*y+M[5])*dpr];
function toTable(e){

let last=performance.now(),acc=0;
function frame(now){
  const dt=Math.min(0.05,Math.max(0,(now-last)/1000)); last=now;
  if(G.phase==='strike'&&now-G.strike.t0>=STRIKE_MS) doStrike();
  if(G.phase==='moving'){
    acc+=dt*G.speed;
    while(acc>=FIX){
      acc-=FIX;
      const mv=advance(S,FIX,EV); S.shot.t+=FIX;
      if(!mv||S.shot.t>40){
        for(const b of S.balls){b.vx=0;b.vy=0;}
        acc=0; playEvents(); endShot(); break;
      }
    }
    playEvents();
  }
  if(G.charging==='key') G.power=Math.min(1,(now-G.chargeT0)/1400);
  if(G.mode==='online') netTick(now);
  updatePowerUI();
  render(now);
  requestAnimationFrame(frame);
}

  }
  side.classList.toggle('disabled',!canHumanShoot());
  netBar();
}
let lastPow=-1;
function updatePowerUI(){
  if(G.power===lastPow) return; lastPow=G.power;
  const rest=(100-G.power*100).toFixed(2)+'%';
  powerFill.style.clipPath=portrait?`inset(0 ${rest} 0 0)`:`inset(0 0 ${rest} 0)`;
}
function updateSpinUI(){
  spinDot.style.left=(50+G.spin.x*40)+'%';
  spinDot.style.top=(50-G.spin.y*40)+'%';
}
function hideOverlay(){overlay.classList.remove('show'); olOpen=false;}
function showHelp(){
  ovCard.className='card';
  ovCard.innerHTML=`<h2>Хэрхэн тоглох вэ? (8 бөмбөг)</h2><ul>
    <li><b>Зорилго:</b> өөрийн 7 бөмбөгийг (бүтэн 1–7 эсвэл судалтай 9–15) оруулаад, хамгийн сүүлд 8-р бөмбөгийг оруулсан нь ялна.</li>
    <li><b>Онилох:</b> ширээн дээр дарж эсвэл чирж чиглэлээ сонго. ↺ ↻ товч эсвэл гарын ← → сумаар нарийн тааруулна (Shift — том алхам).</li>
    <li><b>Цохих:</b> «Хүч» самбарыг татаад (доош эсвэл баруун тийш) суллана. Компьютер дээр Space товчийг дарж барьж байгаад суллаж болно.</li>
    <li><b>Эргэлт:</b> жижиг цагаан бөмбөг дээрх улаан цэгийг дээш тавибал урагшилна, доош тавибал буцаж ухарна, хажуу тийш тавибал хажуугийн эргэлт өгнө. Давхар дарвал цэвэрлэнэ.</li>
    <li><b>Алдаа:</b> цагаан бөмбөг нүхэнд орох, юу ч мөргөхгүй байх, эхлээд өрсөлдөгчийн бөмбөгийг мөргөх. Алдаа гарвал өрсөлдөгч цагаан бөмбөгийг хүссэн газраа тавина (тасархай дугуйг чирнэ).</li>
    <li><b>8-р бөмбөг:</b> цагаасаа өмнө оруулах эсвэл оруулахдаа алдаа гаргавал хожигдоно.</li>
  </ul><div class="row"><button class="btn primary" id="ovOk">Ойлголоо</button></div>`;
  overlay.classList.add('show');
  $('#ovOk').onclick=()=>{audio(); hideOverlay();};
}
function showWin(w,why){
  const nm=names();
  ovCard.className='card win';
  ovCard.innerHTML=`<div class="trophy">🏆</div><h2>${nm[w]} яллаа!</h2><p class="why">${why}</p>
    <div class="row"><button class="btn" id="ovClose">Хаах</button><button class="btn primary" id="ovAgain">Дахин тоглох</button></div>`;
  overlay.classList.add('show');
  $('#ovClose').onclick=hideOverlay;
  $('#ovAgain').onclick=()=>{audio(); hideOverlay(); newGame();};
}

/* ================= input ================= */
let drag=null;
function placeCue(x,y){
  const c=S.balls[0], kitchen=G.bih==='kitchen', maxX=kitchen?HEAD_X:W-R;
  x=clamp(x,R,maxX); y=clamp(y,R,H-R);
  for(let it=0;it<6;it++){
    let moved=false;
    for(const b of S.balls){
      if(!b.on||b.id===0) continue;
      let dx=x-b.x,dy=y-b.y,d=Math.hypot(dx,dy);
      if(d<2*R+0.6){ if(d<1e-6){dx=1;dy=0;d=1;} const k=(2*R+0.6)/d; x=clamp(b.x+dx*k,R,maxX); y=clamp(b.y+dy*k,R,H-R); moved=true; }
    }
    if(!moved) break;
  }
  if(validPos(x,y,kitchen,0)){c.x=x;c.y=y;}
}
function setAimTo(p){const c=S.balls[0]; if(Math.hypot(p.x-c.x,p.y-c.y)>3) G.aim=Math.atan2(p.y-c.y,p.x-c.x);}
cv.addEventListener('pointerdown',e=>{
  if(!canHumanShoot()) return;
  audio(); const p=toTable(e), c=S.balls[0];
  if(G.bih&&Math.hypot(p.x-c.x,p.y-c.y)<R*2.6){drag='ball'; cv.style.cursor='grabbing';}
  else{drag='aim'; setAimTo(p);}
  try{cv.setPointerCapture(e.pointerId);}catch(_){}
  e.preventDefault();
});
cv.addEventListener('pointermove',e=>{
  const p=toTable(e);
  if(drag==='ball'){placeCue(p.x,p.y); return;}
  if(drag==='aim'){setAimTo(p); return;}
  const c=S.balls[0];
  cv.style.cursor=(G.bih&&canHumanShoot()&&Math.hypot(p.x-c.x,p.y-c.y)<R*2.6)?'grab':'crosshair';
});
const endDrag=()=>{drag=null; cv.style.cursor='crosshair';};
cv.addEventListener('pointerup',endDrag); cv.addEventListener('pointercancel',endDrag);

powerEl.addEventListener('pointerdown',e=>{
  if(!canHumanShoot()) return;
  audio(); try{powerEl.setPointerCapture(e.pointerId);}catch(_){}
  G.charging={id:e.pointerId,x0:e.clientX,y0:e.clientY}; e.preventDefault();
});
powerEl.addEventListener('pointermove',e=>{
  const ch=G.charging; if(!ch||ch.id!==e.pointerId) return;
  const r=powerEl.getBoundingClientRect(), len=portrait?r.width:r.height;
  const d=portrait?e.clientX-ch.x0:e.clientY-ch.y0;
  G.power=clamp(d/(len*0.9),0,1);
});
const powerUp=e=>{
  const ch=G.charging; if(!ch||ch.id!==e.pointerId) return;
  G.charging=null;
  if(e.type==='pointerup'&&G.power>0.015&&canHumanShoot()) shoot(); else G.power=0;
};
powerEl.addEventListener('pointerup',powerUp); powerEl.addEventListener('pointercancel',powerUp);

function setSpinFrom(e){
  const r=spinEl.getBoundingClientRect();
  let x=(e.clientX-(r.left+r.width/2))/(r.width/2), y=(e.clientY-(r.top+r.height/2))/(r.height/2);
  const m=Math.hypot(x,y); if(m>1){x/=m;y/=m;}
  G.spin={x,y:-y}; updateSpinUI();
}
let spinDrag=false;
spinEl.addEventListener('pointerdown',e=>{if(!canHumanShoot())return; spinDrag=true; try{spinEl.setPointerCapture(e.pointerId);}catch(_){} setSpinFrom(e); e.preventDefault();});
spinEl.addEventListener('pointermove',e=>{if(spinDrag) setSpinFrom(e);});
spinEl.addEventListener('pointerup',()=>{spinDrag=false;});
spinEl.addEventListener('pointercancel',()=>{spinDrag=false;});
spinEl.addEventListener('dblclick',()=>{G.spin={x:0,y:0}; updateSpinUI();});

function holdButton(el,fn){
  let t1=null,t2=null;
  const stop=()=>{clearTimeout(t1); clearInterval(t2); t1=t2=null;};
  el.addEventListener('pointerdown',e=>{
    e.preventDefault(); if(!canHumanShoot()) return; fn(1);
    let n=0; t1=setTimeout(()=>{t2=setInterval(()=>{n++; fn(n>25?4:1);},45);},280);
  });
  ['pointerup','pointerleave','pointercancel'].forEach(ev=>el.addEventListener(ev,stop));
}
holdButton($('#rotL'),m=>{G.aim-=0.0035*m;});
holdButton($('#rotR'),m=>{G.aim+=0.0035*m;});

window.addEventListener('keydown',e=>{
  if(overlay.classList.contains('show')) return;
  if(e.key==='ArrowLeft'||e.key==='ArrowRight'){
    if(!canHumanShoot()) return;
    G.aim+=(e.key==='ArrowLeft'?-1:1)*(e.shiftKey?0.02:0.0035); e.preventDefault();
  }else if(e.code==='Space'){
    e.preventDefault(); if(e.repeat||!canHumanShoot()||G.charging) return;
    audio(); G.charging='key'; G.chargeT0=performance.now();
  }
});
window.addEventListener('keyup',e=>{
  if(e.code!=='Space') return; e.preventDefault();
  if(G.charging==='key'){G.charging=null; if(G.power>0.015&&canHumanShoot()) shoot(); else G.power=0;}
});

const modeSel=$('#mode');
let prevMode=modeSel.value;
modeSel.addEventListener('change',()=>{
  modeSel.blur();
  if(modeSel.value==='online'){ showOnline(); return; }
  if(G.mode==='online') netLeave();
  G.mode=prevMode=modeSel.value; G.wins=[0,0]; newGame();
});
$('#newBtn').addEventListener('click',e=>{e.currentTarget.blur(); audio(); newGame();});
$('#helpBtn').addEventListener('click',e=>{e.currentTarget.blur(); showHelp();});
const muteBtn=$('#muteBtn');
muteBtn.addEventListener('click',()=>{muted=!muted; muteBtn.textContent=muted?'🔇':'🔊'; muteBtn.blur(); audio();});
overlay.addEventListener('pointerdown',e=>{if(e.target===overlay&&G.phase!=='over'){ if(olOpen) closeOnline(); else hideOverlay(); }});
$('#netLeave').addEventListener('click',e=>{e.currentTarget.blur(); netLeave(); modeSel.value=prevMode; G.mode=prevMode; G.wins=[0,0]; newGame();});

const LABELS={ai1:['Компьютер · хялбар','Комп. · хялбар'],ai2:['Компьютер · дунд','Комп. · дунд'],ai3:['Компьютер · хэцүү','Комп. · хэцүү'],pvp:['2 тоглогч','2 тоглогч'],online:['🌐 Онлайн','🌐 Онлайн']};
function setLabels(){const n=innerWidth<560?1:0; for(const o of modeSel.options) o.textContent=LABELS[o.value][n];}
setLabels();
window.addEventListener('resize',()=>{setLabels(); layout();});
if(window.ResizeObserver) new ResizeObserver(layout).observe(stage);

/* ================= start ================= */
G.mode=modeSel.value;
newGame();
layout();
showHelp();
requestAnimationFrame(t=>{last=t; frame(t);});

/* testing hooks */
window.__pool={G,NET,shoot,netSnap,get S(){return S;},toScreen:(x,y)=>[M[0]*x+M[2]*y+M[4],M[1]*x+M[3]*y+M[5]],showWin,newGame,judge,advance,endShot,buildCandidates,evalCand,applyShot,shotCtx,FIX,
  autoTurn(noise){
    const cands=buildCandidates(), ctx=shotCtx();
    for(const c of cands) c.score=evalCand(c,ctx);
    cands.sort((a,b)=>b.score-a.score);
    const c=cands[0], L=noise?AI_LEVEL[noise]:null;
    if(c.pos&&G.bih){S.balls[0].x=c.pos.x; S.balls[0].y=c.pos.y;}
    const ang=c.angle+(L?gauss()*L.noise*Math.PI/180:0), pw=L?clamp(c.power*(1+gauss()*L.pnoise),0.05,1):c.power;
    G.ctx=ctx; applyShot(S,ang,pw,0,c.sy||0); G.bih=null; G.phase='moving';
    let n=0; while(n<4800&&advance(S,FIX,null)) n++;
    endShot();
    return {score:c.score,n};
  }};
})();
</script>
